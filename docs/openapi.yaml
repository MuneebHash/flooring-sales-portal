      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BadGateway:
      description: >
        Bad Gateway. An upstream/provider dependency failed (e.g. the email provider could not
        send the invoice — error.code EMAIL_SEND_FAILED). Phase 13.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Gone:
      description: >
        Gone. The public quote link is no longer usable - it has expired (QUOTE_LINK_EXPIRED),
        been replaced/superseded (QUOTE_LINK_SUPERSEDED), been cancelled (QUOTE_LINK_CANCELLED),
        or already been signed (QUOTE_LINK_INACTIVE). Phase 16B.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    InvoiceLinkGone:
      description: >
        Gone (16G PR 4, planned). The public invoice link was found but is dead, so the action
        (accept or pdf) is refused: INVOICE_LINK_REPLACED "This invoice link has been replaced.
        Please use the latest invoice link."; INVOICE_LINK_REWRITTEN "This invoice has been
        revised. Please contact the store for the updated invoice."; INVOICE_LINK_SIGNED "This
        invoice has already been signed. Please contact the store if you need a copy.";
        INVOICE_LINK_EXPIRED "This invoice link has expired. Please contact the store." (including
        a link that lapses on this access). The public GET never returns 410: it returns 200 with
        the dead state and its message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'