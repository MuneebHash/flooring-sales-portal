            INVOICE_VERSION_STALE "Invoice updated, please refresh". Never used to look up a row.
        signature:
          type: string
          format: binary
          description: >-
            Customer signature image, with the public quote accept's rules unchanged: missing or
            empty 422 SIGNATURE_REQUIRED; declared type image/png and at most 2097152 bytes; the
            bytes start with the 8-byte PNG signature; the first chunk is a 13-byte IHDR within
            the safe-decode bounds (at most 8192 px per side and 4000000 px in total, bit depth at
            most 8, a valid colour type 0, 2, 3, 4 or 6) and the PNG reader decodes it; otherwise
            400 SIGNATURE_INVALID. The decoded pixels are re-encoded as a clean PNG and only those
            normalised bytes are stored and embedded in the signed PDF.

