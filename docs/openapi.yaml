    QuoteAcceptedSummary:
      type: object
      additionalProperties: false
      description: >-
        The order's LATEST accepted quote version (max(version_number) among ACCEPTED versions;
        Phase 16F PR1), selected independently of the draft and of current_issued; older accepted
        versions remain signed history and are not surfaced. Every body field is the frozen
        accepted snapshot - never the live draft or order; quote_total_inc_gst is the legal billing
        number. All fields are always present (nullable ones as null). Protected portal view only:
        no stored_file id, storage path, token, hash, cost or GP field.
      required:
        - quote_version_id
        - version_number
        - quote_total_inc_gst
        - accepted_at
        - accepted_customer_name
        - accepted_signature_present
        - invoice_eligible
        - quote_total_ex_gst
        - itemised
        - flooring_type
        - details_of_sale
        - lines
        - signature_download_path
        - signed_pdf_available
        - invoice_created_from_this_version
      properties:
        quote_version_id:
          type: integer
          format: int64
          description: >-
            The accepted version's id. From 16G PR 3 the Quote tab sends it as quote_version_id on
            createInvoiceFromQuote (#123); from 16G PR 6 it addresses the version-bound accepted
            reads (#122).
        version_number:
          type: integer
        quote_total_inc_gst:
          $ref: '#/components/schemas/Money'
        accepted_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: >-
            When the customer signed. From 16G PR 6 (#124) formatted to whole seconds, like every
            quote timestamp the API returns (stored values unchanged).
        accepted_customer_name:
          type: string
          description: >-
            Frozen at acceptance from the issued version's V17 customer_name_snapshot (16F decision
            D1) - never the live customer record, never typed, never truncated.
        accepted_signature_present:
          type: boolean
          description: True when a signature image is stored for this accepted version.
        invoice_eligible:
          type: boolean
          description: >-
            Phase 16F PR2 (decision D5(b) as amended on 8 October 2026): the same strict
            signature-precedence rule createInvoiceFromQuote (Path A, implemented) enforces. True
            when the order has no invoice, when its current invoice (highest version_number) is
            unsigned, or when this quote's accepted_at is strictly later than the current invoice's
            accepted_at; false when the current invoice was signed at the same time or later than
            this quote (a newer signed quote is then required). Signature times are compared, never
            invoice creation times or version numbers. It reflects this rule only: LAID, a draft or
            a newer issued quote, missing invoice preconditions, a blank details of sale, a zero
            total or overpayment never make it false (the endpoint validates those itself).
        quote_total_ex_gst:
          $ref: '#/components/schemas/Money'
        itemised:
          type: boolean
        flooring_type:
          $ref: '#/components/schemas/FlooringType'
        details_of_sale:
          type: string
          nullable: true
          description: The frozen details_of_sale_snapshot as issued (may be null or blank).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteIssuedLine'
          description: >-
            Accepted snapshot lines in display order; always empty when the accepted quote is
            non-itemised.
        signature_download_path:
          type: string
          nullable: true
          description: >-
            Backend-built protected path /api/v1/{slug}/orders/{orderId}/quote/accepted/signature
            (downloadAcceptedQuoteSignature); consume verbatim. Null when no signature is stored.
            From 16G PR 6 (#122) it carries the version-addressed path
            /api/v1/{slug}/orders/{orderId}/quote/accepted/{quoteVersionId}/signature
            (downloadAcceptedQuoteVersionSignature) for this version.
        signed_pdf_available:
          type: boolean
          description: >-
            True when the stored signed PDF exists; stream it via
            GET /orders/{orderId}/quote/pdf?type=accepted (from 16G PR 6, #122:
            GET /orders/{orderId}/quote/accepted/{quoteVersionId}/pdf with this quote_version_id).
        invoice_created_from_this_version:
          type: boolean
          description: >-
            16G PR 6 (planned, #124; not returned until PR 6 merges). Always present once
            implemented, computed inside the one-snapshot workspace read. True when the order's
            CURRENT invoice was created from this accepted quote version by createInvoiceFromQuote
            (Path A), including the payment and void versions carried from it (its source quote
            version is this version); false when there is no invoice or the current invoice has
            another origin (Create, Rewrite, or a signing that was not this conversion). When
            invoice_eligible is false the Accepted Quote explanation reads "An invoice has already
            been created from this quote." if this is true, otherwise "The current invoice was
            signed at the same time or later than this quote. A newer signed quote is required to
            create an invoice from a quote." It replaces the frontend's 19-character accepted_at
            comparison; no provenance id is added to InvoiceDetail.

