        been replaced. Please use the latest invoice link."). REWRITTEN: a manual Rewrite revised
        the invoice ("This invoice has been revised. Please contact the store for the updated
        invoice."). SIGNED: the invoice was signed remotely, in store or by Create Invoice from the
        accepted quote ("This invoice has already been signed. Please contact the store if you
        need a copy."). EXPIRED: 7 days passed ("This invoice link has expired. Please contact the
        store."). These are the only invoice states; the quote states CANCELLED, SUPERSEDED and
        INACTIVE do not exist on the invoice surface.
      enum:
        - ACTIVE
        - REPLACED
        - REWRITTEN
        - SIGNED
        - EXPIRED

