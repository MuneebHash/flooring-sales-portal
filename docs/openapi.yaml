    InvoiceDetail:
      type: object
      additionalProperties: false
      required:
        - invoice_id
        - order_id
        - version_number
        - invoice_date
        - due_date
        - details_of_sale_snapshot
        - sale_price_ex_gst
        - sale_price_inc_gst
        - total_paid
        - balance_due
        - created_by_user_id
        - created_at
        - pdf_download_path
        - accepted_at
        - accepted_customer_name
        - accepted_signature_present
        - accepted_signature_download_path
        - last_emailed_at
        - terms_html
        - terms_source
        - customer_name_snapshot
        - customer_address_line1_snapshot
        - customer_address_line2_snapshot
        - invoice_link_expires_at
      properties:
        invoice_id:
          type: integer
          format: int64
        order_id:
          type: integer
          format: int64
        version_number:
          type: integer
          description: >-
            The version's number (1, 2, 3 ...); the highest is the current invoice. From 16G PR 3
            the Invoice tab sends the version_number of the invoice on screen as
            expected_version_number on acceptCurrentInvoice (#69).
        invoice_date:
          allOf:
            - $ref: '#/components/schemas/Date'
          description: >-
            Today every invoice writer dates its new version with the server's current date
            (LocalDate.now()), in-store acceptance included; from 16G PR 3 (acceptCurrentInvoice)
            and 16G PR 4 (acceptPublicInvoice) a signing version instead copies invoice_date from
            the version it signs, while createInvoice, rewriteInvoice, createInvoiceFromQuote,
            recordPayment and voidPayment keep dating their version the day it is written.
        due_date:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Date'
        details_of_sale_snapshot:
          type: string
        sale_price_ex_gst:
          $ref: '#/components/schemas/Money'
        sale_price_inc_gst:
          $ref: '#/components/schemas/Money'
        total_paid:
          $ref: '#/components/schemas/Money'
        balance_due:
          $ref: '#/components/schemas/Money'
        created_by_user_id:
          type: integer
          format: int64
          description: >-
            The staff user who created the version. From 16G PR 4, a version appended by remote
            signing (acceptPublicInvoice) records the staff user who sent the link
            (invoice_token.sent_by_user_id).
        created_at:
          $ref: '#/components/schemas/Timestamp'
        pdf_download_path:
          type: string
        accepted_at:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        accepted_customer_name:
          type: string
          nullable: true
          description: >-
            The name recorded at acceptance, never typed. Today D.8 records the name the Invoice
            tab sends (derived from the saved customer). From 16G PR 3 D.8 records the version's
            frozen customer_name_snapshot verbatim, full length; remote signing does the same
            (PR 4); Path A inherits the accepted quote's name (unchanged).
        accepted_signature_present:
          type: boolean
        accepted_signature_download_path:
          type: string
          nullable: true
        last_emailed_at:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: >-
            When this version's signed PDF was emailed successfully, or null. Set by Accept and
            Re-send today; from 16G PR 3 also by createInvoiceFromQuote; from 16G PR 4 also by
            remote signing. An invoice link email (sendInvoiceLink) never sets it.
        terms_html:
          type: string
          nullable: true
          description: >-
            Phase 16F PR2 (decision D7); since 16G PR 2 (#125). Always present. The terms the
            version renders: always the version's own stored terms_snapshot, verbatim - frozen
            when the version was created (Create and Rewrite freeze the business's
            per-flooring-type terms, sanitised once; Path A copies the accepted quote's frozen
            terms; payment, void and signing versions copy the previous version's terms,
            including null). Null means no terms page, with no live fallback, on every version
            and both terms sources. (In 16F a LIVE invoice's terms were read at every render;
            that branch is removed.)
        terms_source:
          type: string
          enum:
            - QUOTE
            - BUSINESS
          description: >-
            Always present; reports where the version's stored terms came from and never triggers
            a lookup; selected by source presence, never by whether terms_html is null. QUOTE: the
            version has a source quote version (Path A, and the payment, void and in-app accept
            versions carried from it). BUSINESS (16G PR 2, #125): no source quote version - the
            business's per-flooring-type terms, frozen into the version at Create or Rewrite and
            carried by payment, void and signing versions; a manual rewrite returns to BUSINESS.
            BUSINESS replaced the 16F value LIVE in 16G PR 2. The internal source quote version
            id is never exposed.
        customer_name_snapshot:
          type: string
          nullable: true
          description: >-
            16G PR 2 (#125). Always present. The Invoice To name frozen into this version: first,
            middle (when present) and last name, each trimmed, joined by single spaces (the V17
            quote derivation). Create and Rewrite freeze it from the saved customer; payment, void
            and D.8 copy it verbatim (including null), as remote signing will from 16G PR 4; Path A
            copies the accepted quote's V17 customer_name_snapshot. The Invoice tab and the PDF show
            Invoice To from these three fields, never from the live customer. From 16G PR 3 it is
            also the accepted name D.8 records (a null or blank value gives 422
            ACCEPTED_CUSTOMER_NAME_REQUIRED).
        customer_address_line1_snapshot:
          type: string
          nullable: true
          description: >-
            16G PR 2 (#125). Always present. Billing line 1 frozen into this version,
            "[unit/]street_number street"; written and copied as customer_name_snapshot. Null
            renders as absent.
        customer_address_line2_snapshot:
          type: string
          nullable: true
          description: >-
            16G PR 2 (#125). Always present. Billing line 2 frozen into this version, "suburb
            state_code postcode"; written and copied as customer_name_snapshot. Null renders as
            absent.
        invoice_link_expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
          description: >-
            16G PR 4 (planned; not returned until PR 4 merges). Always present once implemented.
            Derived response metadata, not a frozen word and not one of the three PR 2
            customer_*_snapshot fields: computed in the read from server state as the expires_at
            of the order's ACTIVE invoice link (invoice_token) whose expiry is still in the
            future; null when no link was sent, when the link is dead (REPLACED, REWRITTEN, SIGNED
            or EXPIRED), or when an ACTIVE link is already past expires_at. It is not an invoice
            column (no migration beyond the invoice_token table) and no writer freezes or copies
            it. Reading it writes nothing and never expires a token (lazy expiry stays on the
            public surface). Every InvoiceDetail response carries it, computed after the request's
            own writes: rewriteInvoice, acceptCurrentInvoice and createInvoiceFromQuote kill an
            ACTIVE link in their own transaction, so they return null, and a signed current
            invoice always gives null. From 16G PR 6 (#120) the Invoice tab reads it only to decide
            whether to poll getCurrentInvoice; it is never displayed (no link status line, expiry
            display or cancel). Not part of CurrentInvoiceSummary (the payment and void responses)
            or of any public invoice payload.

