openapi: 3.0.3
info:
  title: Sales Portal MVP API
  version: 1.0.0
  description: Generated from locked Phase 4 API conventions and Chunk 1–4 contracts.

servers:
  - url: /api/v1/{slug}
    variables:
      slug:
        default: aussie-floors-group
        description: Business slug tenant key resolved by the backend.

security:
  - SessionCookieAuth: []

tags:
  - name: Auth
  - name: Dashboard
  - name: Orders
  - name: Customer
  - name: Addresses
  - name: DetailsOfSale
  - name: Catalog
  - name: Lines
  - name: Financials
  - name: Notes
  - name: Attachments
  - name: Invoices
  - name: Payments

paths: {}

components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-side session cookie used by protected Sales Portal endpoints.

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrderStatus'
    WeekYear:
      name: week_year
      in: query
      required: false
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    WeekNumber:
      name: week_number
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 53

  schemas:
    FlooringType:
      type: string
      enum:
        - SOFT
        - HARD

    OrderStatus:
      type: string
      enum:
        - LEAD
        - NEW_ACHIEVED_SALE
        - FOLLOW_UP
        - ACCEPTED
        - LAID
        - CANCELLED

    LayDateStatus:
      type: string
      enum:
        - CONFIRMED
        - TO_BE_CONFIRMED

    PaymentMethod:
      type: string
      enum:
        - CASH
        - CREDIT_CARD
        - EFTPOS
        - BANK_TRANSFER

    AttachmentKind:
      type: string
      enum:
        - PHOTO
        - SIGNATURE

    PhotoAttachmentKind:
      type: string
      enum:
        - PHOTO

    AddressType:
      type: string
      enum:
        - BILLING
        - INSTALLATION

    PricingUnit:
      type: string
      enum:
        - LM
        - SQM

    StockUnit:
      type: string
      enum:
        - LM
        - SQM

    Money:
      type: number
      format: double
      example: 45.00
      description: AUD money amount, returned with two decimal places.

    Date:
      type: string
      format: date
      example: '2026-05-01'

    Timestamp:
      type: string
      format: date-time
      example: '2026-04-22T14:30:00'
      description: Server-local timestamp returned as YYYY-MM-DDTHH:mm:ss.

    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - page_size
        - total_items
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    ValidationErrorDetail:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        section:
          type: string
          nullable: true
        field:
          type: string
          nullable: true
        message:
          type: string

    StandardError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'

    StandardErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/StandardError'

    NullDataResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          nullable: true
          description: Always null.
          example: null
        message:
          type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
