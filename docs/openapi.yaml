        Public, token-only quote view. Phase 16E-C extends the original 16B shape ADDITIVELY with
        the document fields the public quote page renders (Quotation To, Details of Sale, totals
        breakdown, deposit) — all nullable, populated only when state is ACTIVE, sourced from the
        frozen issued snapshot plus the same live presentation context the issued PDF reads
        (business branding, saved customer name/billing address). Still cost-free, GP-free and
        internal-ID-free: order_number is the business-facing document number already printed on
        the delivered PDF, not an internal id. A non-ACTIVE state returns the minimal payload
        (state, business_name, message; every document field null).
      properties:
        state:
          $ref: '#/components/schemas/PublicQuoteState'
        business_name:
          type: string
        business_logo_url:
          type: string
          nullable: true
        accent_color:
          type: string
          nullable: true
        business_abn:
          type: string
          nullable: true
          description: Business ABN as shown on the issued PDF; present when state is ACTIVE.
        payment_account_name:
          type: string
          nullable: true
          description: Direct-deposit account name as shown on the issued PDF; present when state is ACTIVE.
        payment_bank_name:
          type: string
          nullable: true
          description: Direct-deposit bank name as shown on the issued PDF; present when state is ACTIVE.
        payment_bsb:
          type: string
          nullable: true
          description: Direct-deposit BSB as shown on the issued PDF; present when state is ACTIVE.
        payment_account_number:
          type: string
          nullable: true
          description: Direct-deposit account number as shown on the issued PDF; present when state is ACTIVE.
        payment_stripe_link_url:
          type: string
          nullable: true
          description: Tenant Stripe payment-link URL as used by the Payments tab; present when state is ACTIVE.
        order_number:
          type: string
          nullable: true
          description: Document number under the QUOTATION title; present when state is ACTIVE.
        flooring_type:
          allOf:
            - $ref: '#/components/schemas/FlooringType'
          nullable: true
          description: The frozen flooring_type_snapshot; present when state is ACTIVE.
        customer_name:
          type: string
          nullable: true
          description: Quotation To — the saved customer name; present when state is ACTIVE.
        customer_address_line1:
          type: string
          nullable: true
          description: Quotation To billing address line 1; present when state is ACTIVE.
        customer_address_line2:
          type: string
          nullable: true
          description: Quotation To billing address line 2; present when state is ACTIVE.
        details_of_sale:
          type: string
          nullable: true
          description: The frozen details_of_sale_snapshot; present when state is ACTIVE.
        itemised:
          type: boolean
          nullable: true
          description: Present when state is ACTIVE.
        lines:
          type: array
          nullable: true
          description: >
            Present when state is ACTIVE and itemised (frozen issued snapshot lines in display
            order); always an empty array for an ACTIVE non-itemised quote (a non-itemised issue
            snapshots zero lines).
          items:
            $ref: '#/components/schemas/PublicQuoteLine'
        quote_total_ex_gst:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Subtotal ex GST from the frozen snapshot; present when state is ACTIVE.
        gst_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Server-computed inc − ex (issued-PDF math); present when state is ACTIVE.
        quote_total_inc_gst:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Present when state is ACTIVE.
        deposit_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: >
            Display-only 40% of the inc-GST total, server-computed with the exact issued-PDF
            rounding (HALF_UP 2dp); present when state is ACTIVE. Never persisted.
        terms_html:
          type: string
          nullable: true
          description: Frozen, sanitized terms HTML; present when state is ACTIVE.
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        message:
          type: string
          nullable: true
          description: Customer-facing message for non-ACTIVE states.

    PublicQuoteViewWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PublicQuoteView'
        message:
          type: string

    QuoteAcceptRequest:
      type: object
      additionalProperties: false
      required:
        - signature
      properties:
        signature:
          type: string
          format: binary
          description: >
            Customer signature image. PNG only (image/png), non-empty, max 2 MB (2097152 bytes).
            accepted_customer_name is NOT accepted here - it is taken server-side from the saved
            order customer (Phase 16B).

    PublicQuoteAcceptResult:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/PublicQuoteState'

    PublicQuoteAcceptResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PublicQuoteAcceptResult'
        message:
          type: string

  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BadGateway:
      description: >
        Bad Gateway. An upstream/provider dependency failed (e.g. the email provider could not
        send the invoice — error.code EMAIL_SEND_FAILED). Phase 13.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Gone:
      description: >
        Gone. The public quote link is no longer usable - it has expired (QUOTE_LINK_EXPIRED),
        been replaced/superseded (QUOTE_LINK_SUPERSEDED), been cancelled (QUOTE_LINK_CANCELLED),
        or already been signed (QUOTE_LINK_INACTIVE). Phase 16B.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'