        of Sale. The frontend sends the final GST-inclusive sale price only, and
        the backend derives and stores sales_order.price_adjustment_inc_gst.
        price_adjustment_inc_gst may be negative, positive, or zero. The backend
        recalculates sale_price_ex_gst, gp, and gp_percent. The frontend must not
        send derived fields. Blocked when order is LAID with 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
