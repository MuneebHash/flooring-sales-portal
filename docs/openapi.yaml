    QuoteAcceptRequest:
      type: object
      additionalProperties: false
      required:
        - signature
      properties:
        signature:
          type: string
          format: binary
          description: >
            Customer signature image (implemented 16F PR1). The ONLY part: any other file part,
            form field or request parameter, or a second signature part, is rejected (400
            VALIDATION_FAILED). Missing or empty returns 422 (SIGNATURE_REQUIRED). PNG only: the
            declared content type must be image/png and the size at most 2 MB (2097152 bytes;
            exactly 2097152 is allowed); the bytes must start with the 8-byte PNG signature, the
            first chunk must be a 13-byte IHDR, and the IHDR (checked before any pixel is decoded)
            must be within the safe-decode bounds - at most 8192 px per side, at most 4000000 px in
            total, bit depth at most 8 (16-bit PNGs are rejected) and a valid PNG colour type - and
            the PNG reader must decode it; otherwise 400 (SIGNATURE_INVALID). Server normalisation:
            the decoded pixels are re-encoded as a clean PNG and only those bytes are stored and
            embedded in the signed PDF - same dimensions and pixels as the upload, but ancillary
            chunks and any bytes after IEND are dropped, so the stored signature (and the protected
            downloadAcceptedQuoteSignature response) is not byte-identical to the upload.
            accepted_customer_name is NOT a part: it is taken server-side from the issued version's
            frozen V17 customer_name_snapshot (16F decision D1), never the live customer record.

