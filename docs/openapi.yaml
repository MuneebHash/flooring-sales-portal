      summary: Cancel active issued quote
      operationId: cancelQuote
      description: >
        Cancels the active issued quote (Phase 16B): version becomes CANCELLED and the active
        token becomes CANCELLED (kept for messaging; link dead). Requires an active ISSUED version:
        with none, an order that has an ACCEPTED quote version returns 409
        (QUOTE_ALREADY_ACCEPTED - reachable since 16F PR1 creates ACCEPTED versions), otherwise 422
        (QUOTE_NOT_ISSUED). An ISSUED version sent after an acceptance is cancelled normally; an
        ACCEPTED version is never touched. Never writes the order sale price. Empty JSON object
        body. Allowed when LAID as a narrow exception (kills a public link only; not an order
        mutation).
      parameters:
