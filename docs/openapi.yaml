openapi: 3.0.3
info:
  title: Sales Portal MVP API
  version: 1.0.0
  description: >-
    Generated from locked Phase 4 API conventions and Chunk 1–4 contracts, plus the Phase 13
    Invoice Acceptance + Signature + Email addendum
    (docs/API-Contracts-Phase13-Acceptance-Signature-Email.md).

servers:
  - url: /api/v1/{slug}
    variables:
      slug:
        default: aussie-floors-group
        description: Business slug tenant key resolved by the backend.

security:
  - SessionCookieAuth: []

tags:
  - name: Auth
  - name: Dashboard
  - name: Orders
  - name: Customer
  - name: Addresses
  - name: DetailsOfSale
  - name: Catalog
  - name: Lines
  - name: Financials
  - name: Notes
  - name: Attachments
  - name: Invoices
  - name: Payments
  - name: Quotes

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      operationId: login
      security: []
      description: >
        Business is resolved from the URL slug. Login uses salesperson_code and password.
        On success, the server creates a server-side session cookie (no JWT). Single-store
        users receive active_store_id immediately. Multi-store users receive
        store_selection_required as true and active_store_id as null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/select-store:
    post:
      tags:
        - Auth
      summary: Select active store
      operationId: selectStore
      description: >
        Session is required, but an active store in session is not required on entry.
        The user must belong to the business resolved from slug. The requested store
        must belong to that business and the user must have access. Re-selecting the
        same store returns 200 idempotently. Selecting a different store after one is
        already selected returns 409 STORE_ALREADY_SELECTED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectStoreRequest'
      responses:
        '200':
          description: Store selected or idempotent same-store reselect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectStoreResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      operationId: logout
      description: >
        Session is required. Active store in session is not required. The server
        invalidates the server-side session and clears the session cookie.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders:
    get:
      tags:
        - Dashboard
      summary: List dashboard orders
      operationId: listDashboardOrders
      description: >
        Standard protected endpoint. Data is scoped to the active (business_id, store_id).
        Empty results return 200 with an empty data array. Default ordering is
        sales_order.created_at descending. Search is case-insensitive partial match across
        sales_order.order_number, order_customer.first_name, order_customer.last_name,
        order_customer.email, order_customer.company_name, and order_customer.mobile.
        CANCELLED orders are included unless filtered out. No sort query parameter in MVP.
        Status filter is a single enum value only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/WeekYear'
        - $ref: '#/components/parameters/WeekNumber'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOrdersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Orders
      summary: Create order
      operationId: createOrder
      description: >
        Creates a new order shell. No customer, address, details-of-sale, or lines
        are required at creation time. The backend sets business_id, store_id, and
        user_id from the active session; the client never sends business_id,
        store_id, or user_id. The backend generates order_sequence_number,
        order_number, week_year, and week_number. order_status defaults to LEAD.
        supply_only defaults to false. locked is derived and false on creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order workspace
      operationId: getOrder
      description: >
        Returns the Chunk 2 workspace state: header, customer, installation
        address, billing address, details of sale, and persisted financial readback.
        This is read-only and is allowed even when order_status is LAID. The order
        must belong to the session business/store; cross-store or cross-business
        misses return 404 ORDER_NOT_FOUND. This endpoint does not include live
        order_financial_summary; that belongs to Chunk 3 mutation responses.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWorkspaceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/status:
    patch:
      tags:
        - Dashboard
      summary: Update order status
      operationId: updateOrderStatus
      description: >
        Dashboard-only status change on a standard protected endpoint. The order must
        belong to the session business and store. Any status can change to any other
        status. Setting LAID locks the order. Changing away from LAID unlocks the order.
        Sending the same status returns 200 as a no-op. Cross-store or cross-business
        misses return 404 ORDER_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Status updated or no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusUpdateResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/customer:
    put:
      tags:
        - Customer
      summary: Save order customer
      operationId: saveOrderCustomer
      description: >
        Creates or replaces the single customer row for an order. PUT is a full
        replacement for customer fields. Optional fields omitted in the request are
        written as null. There is one customer row per order. This endpoint is
        blocked when the order is LAID and returns 422 ORDER_LOCKED. The order must
        belong to the session business/store.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpsertRequest'
      responses:
        '200':
          description: Customer created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/addresses/installation:
    put:
      tags:
        - Addresses
      summary: Save installation address
      operationId: saveInstallationAddress
      description: >
        Creates or replaces the installation address. The path determines
        address_type = INSTALLATION and address_type is not accepted in the request
        body. PUT is a full replacement for address fields. Optional unit_number
        omitted in the request is written as null. This endpoint is blocked when the
        order is LAID and returns 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpsertRequest'
      responses:
        '200':
          description: Installation address created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationAddressResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/addresses/billing:
    put:
      tags:
        - Addresses
      summary: Save billing address
      operationId: saveBillingAddress
      description: >
        Creates or replaces the billing address. The path determines
        address_type = BILLING and address_type is not accepted in the request body.
        PUT is a full replacement for address fields. Optional unit_number omitted
        in the request is written as null. This endpoint is blocked when the order
        is LAID and returns 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpsertRequest'
      responses:
        '200':
          description: Billing address created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddressResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/addresses/billing/copy-from-installation:
    post:
      tags:
        - Addresses
      summary: Copy installation address to billing
      operationId: copyBillingAddressFromInstallation
      description: >
        The backend copies the existing installation address into the billing
        address. No request body is required. If no installation
        address exists, the endpoint returns 422 INSTALLATION_ADDRESS_REQUIRED. If a
        billing address exists it is replaced; if it does not exist it is created.
        Copied fields are unit_number, street_number, street, suburb, state_code,
        and postcode. This endpoint is blocked when the order is LAID and returns
        422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Billing address copied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddressResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/details-of-sale:
    put:
      tags:
        - DetailsOfSale
      summary: Save details of sale
      operationId: saveDetailsOfSale
      description: >
        Updates non-line, non-payment details-of-sale fields on sales_order. PUT is
        a full replacement for the fields this endpoint owns. Required fields not
        present return 400. Optional fields omitted in the request are written as
        null. This endpoint does not include order_financial_summary because these
        fields do not affect financials. Sale price override and Reset Price belong
        to Chunk 3. This endpoint is blocked when the order is LAID and returns 422
        ORDER_LOCKED. proposed_lay_date and lay_date_status must be either both
        null/omitted or both non-null.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetailsOfSaleRequest'
      responses:
        '200':
          description: Details of sale saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailsOfSaleResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/enquiry:
    put:
      tags:
        - Customer
      summary: Save order lead enquiry
      operationId: saveOrderEnquiry
      description: >
        Creates or replaces the single lead-enquiry row for an order (Phase 15F
        lead enquiry form, shown inside the Customer tab). PUT is a full
        replacement: text fields omitted in the request are written as null, the
        NOT NULL product/subfloor flags (carpet, hard_floor, subfloor_concrete,
        subfloor_timber, subfloor_tile) omitted default to false, and the four
        tri-state fields (fully_installed, uplift, furniture, stairs) omitted are
        written as null = unanswered (true = Yes, false = No, null = unanswered;
        a null is never coerced to false). carpet and hard_floor are the products
        the customer is looking for — independent booleans (both/neither may be
        true) and deliberately decoupled from the order's SOFT/HARD flooring_type.
        subfloor_concrete/timber/tile are independent multi-select booleans. The
        enquiry is READ back on the GET order workspace under `enquiry` (there is
        no standalone GET enquiry endpoint). No business_id/store_id/order_id is
        accepted in the body — order_id comes from the path and any such keys are
        ignored. This endpoint is blocked when the order is LAID and returns 422
        ORDER_LOCKED. The order must belong to the session business/store.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: false
        description: >-
          Optional. Because the enquiry has no required fields, an absent or blank
          body is accepted and writes an all-default row (all flags false, all
          tri-state fields null, all text null) — it does NOT 400. In normal use the
          client sends the full field set (full-replace upsert).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnquiryUpsertRequest'
      responses:
        '200':
          description: Lead enquiry created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnquiryResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders/{orderId}/available-products:
    get:
      tags:
        - Catalog
      summary: List available products for order
      operationId: listAvailableProducts
      description: >
        Returns active store products available for the order's flooring type.
        Cost fields are never exposed.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Available products returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableProductsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/available-charges:
    get:
      tags:
        - Catalog
      summary: List available charges for order
      operationId: listAvailableCharges
      description: >
        Returns active store charges available for the order's flooring type.
        Cost fields are never exposed.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Available charges returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableChargesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/lines:
    get:
      tags:
        - Lines
      summary: Get order product and charge lines
      operationId: getOrderLines
      description: >
        Returns all product lines, charge lines, and live financial summary for
        the order. Per-line cost_snapshot is exposed read-only for salesperson
        display; per-line line_cost is never exposed.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order lines returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLinesResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/product-lines:
    post:
      tags:
        - Lines
      summary: Add product line to order
      operationId: addProductLine
      description: >
        Adds a product line and returns the updated financial summary. Backend
        snapshots product_code, product_name, pricing_unit, price, cost, and
        sqm_per_lm. Backend derives the missing quantity using the product
        line's snapshotted sqm_per_lm_snapshot and calculates line_total and
        line_cost internally. Cost fields are never
        accepted from the client. Product must belong to the active store, be
        active, and match the order flooring_type. Blocked when order is LAID
        with 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductLineCreateRequest'
      responses:
        '201':
          description: Product line added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLineMutationResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/product-lines/{lineId}:
    patch:
      tags:
        - Lines
      summary: Update product line quantity and/or unit price
      operationId: updateProductLine
      description: >
        Updates quantity and/or unit price for an existing product line and
        returns the updated financial summary. At least one editable field must
        be present, and at most one of quantity_lm or quantity_sqm may be
        supplied. product_id and snapshot fields cannot be changed, and cost
        fields are never accepted from the client. The line must belong to the
        order in the path. Blocked when order is LAID with 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/LineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductLinePatchRequest'
      responses:
        '200':
          description: Product line updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLineMutationResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Lines
      summary: Delete product line from order
      operationId: deleteProductLine
      description: >
        Deletes a product line, recomputes order_financial_summary, and returns
        the deleted line id with the updated summary. The line must belong to
        the order in the path. Blocked when order is LAID with 422
        ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/LineId'
      responses:
        '200':
          description: Product line deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLineDeleteResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}/charge-lines:
    post:
      tags:
        - Lines
      summary: Add charge line to order
      operationId: addChargeLine
      description: >
        Adds a charge line and returns the updated financial summary. Backend
        snapshots charge_code, charge_name, price, and cost. Backend
        calculates line_total and line_cost internally. Cost fields are never
        accepted from the client. Charge must belong to the active store, be
        active, and match the order flooring_type. Blocked when order is LAID
        with 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeLineCreateRequest'
      responses:
        '201':
          description: Charge line added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeLineMutationResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/charge-lines/{lineId}:
    patch:
      tags:
        - Lines
      summary: Update charge line quantity and/or unit price
      operationId: updateChargeLine
      description: >
        Updates quantity and/or unit price for an existing charge line and
        returns the updated financial summary. At least one editable field must
        be present. charge_id and snapshot fields cannot be changed, and cost
        fields are never accepted from the client. The line must belong to the
        order in the path. Blocked when order is LAID with 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/LineId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeLinePatchRequest'
      responses:
        '200':
          description: Charge line updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeLineMutationResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Lines
      summary: Delete charge line from order
      operationId: deleteChargeLine
      description: >
        Deletes a charge line, recomputes order_financial_summary, and returns
        the deleted line id with the updated summary. The line must belong to
        the order in the path. Blocked when order is LAID with 422
        ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/LineId'
      responses:
        '200':
          description: Charge line deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeLineDeleteResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/sale-price:
    put:
      tags:
        - Financials
      summary: Override sale price
      operationId: overrideSalePrice
      description: >
        Salesperson manually overrides the GST-inclusive sale price shown in Details
        of Sale. The frontend sends the final GST-inclusive sale price only, and
        the backend derives and stores sales_order.price_adjustment_inc_gst.
        price_adjustment_inc_gst may be negative, positive, or zero. The backend
        recalculates sale_price_ex_gst, gp, and gp_percent. The frontend must not
        send derived fields. Blocked when order is LAID with 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalePriceOverrideRequest'
      responses:
        '200':
          description: Sale price overridden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePriceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/sale-price/reset:
    post:
      tags:
        - Financials
      summary: Reset sale price override
      operationId: resetSalePrice
      description: >
        Clears sales_order.price_adjustment_inc_gst back to null. Idempotent: reset
        with no current adjustment is a 200 no-op. The backend recomputes and
        returns order_financial_summary. Blocked when order is LAID with 422
        ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Sale price reset or no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalePriceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/notes:
    get:
      tags:
        - Notes
      summary: List order notes
      operationId: listOrderNotes
      description: >
        Returns order notes in descending created_at order (newest first). Notes are
        immutable and append-only for MVP. This read endpoint is allowed even when
        the order status is LAID. The order must belong to the session business and
        store.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Notes returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Notes
      summary: Add order note
      operationId: addOrderNote
      description: >
        Appends a new immutable note to the order. note_text is required and must be
        non-blank after trim. The backend sets order_id, created_by_user_id, and
        created_at. The client must not send order_note_id, order_id,
        created_by_user_id, or created_at. This endpoint is allowed even when the
        order status is LAID.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddNoteRequest'
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddNoteResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/attachments:
    get:
      tags:
        - Attachments
      summary: List order attachments
      operationId: listOrderAttachments
      description: >
        Returns the order's PHOTO attachments in descending created_at order (newest first).
        This read endpoint is allowed when the order status is LAID. The order must
        belong to the session business and store. Phase 13: the accepted invoice signature is
        invoice-specific and is NEVER returned here (it is not stored as an order_attachment);
        retrieve it via GET /orders/{orderId}/invoices/current/signature.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Attachments returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Attachments
      summary: Upload order attachment
      operationId: uploadOrderAttachment
      description: >
        Uploads and links an attachment to the order. Multipart upload accepts PHOTO
        only for Chunk 3. This endpoint is allowed when the order status is LAID.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttachmentUploadRequest'
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/attachments/{attachmentId}:
    delete:
      tags:
        - Attachments
      summary: Delete order attachment
      operationId: deleteOrderAttachment
      description: >
        Deletes an attachment linked to the order. The attachment must belong to the
        order in the path. Deletion is blocked when the order status is LAID and
        returns 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Attachment deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDeleteResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/attachments/{attachmentId}/file:
    get:
      tags:
        - Attachments
      summary: Download order attachment file
      operationId: downloadOrderAttachmentFile
      description: >
        Returns raw binary file bytes for an attachment linked to the order. This read
        endpoint is allowed when the order status is LAID.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/AttachmentId'
      responses:
        '200':
          description: Attachment file returned
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices:
    post:
      tags:
        - Invoices
      summary: Create invoice version 1
      operationId: createInvoice
      description: >
        Creates the first invoice snapshot for the order (version 1). The request body
        must be an empty JSON object. This endpoint is allowed when the order status is
        LAID if no invoice exists yet. Phase 13: requires a valid customer email on the
        order, validated before the invoice preconditions (else 422 CUSTOMER_EMAIL_REQUIRED
        when missing or CUSTOMER_EMAIL_INVALID when malformed). The created invoice is
        unsigned/unaccepted and creating it sends NO email (last_emailed_at null;
        sales_order.last_emailed_at mirror null).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/rewrite:
    post:
      tags:
        - Invoices
      summary: Rewrite invoice
      operationId: rewriteInvoice
      description: >
        Creates the next official invoice version from current live order state. The
        request body must be an empty JSON object. Phase 13: requires a valid customer
        email (else 422 CUSTOMER_EMAIL_REQUIRED / CUSTOMER_EMAIL_INVALID). The new version
        is UNSIGNED/UNACCEPTED — it clears accepted_at, accepted_customer_name, the
        signature reference and last_emailed_at (sales_order.last_emailed_at mirror becomes
        null); the customer must re-accept. Rewrite sends NO email. Returns 422 when rewrite
        is blocked (including LAID order lock, missing first invoice, or failed preconditions).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Invoice rewritten
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/current:
    get:
      tags:
        - Invoices
      summary: Get current invoice
      operationId: getCurrentInvoice
      description: >
        Returns the current (latest) invoice snapshot for the order. MVP exposes only the
        current invoice; invoice history and per-version detail are deferred post-MVP.
        Returns 404 when no invoice exists yet for the order.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Current invoice returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/current/file:
    get:
      tags:
        - Invoices
      summary: Download current invoice PDF file
      operationId: downloadCurrentInvoicePdf
      description: >
        Streams the current (latest) invoice PDF binary for the order. The order must belong
        to the session business/store. This read endpoint is allowed when order_status is
        LAID. Returns 404 when no invoice exists yet. The backend sets Content-Disposition
        filename as invoice-{order_number}-v{version_number}.pdf. Downloading older versions
        is deferred post-MVP.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Current invoice PDF streamed
          headers:
            Content-Disposition:
              description: Inline PDF filename generated by backend.
              schema:
                type: string
            Content-Length:
              description: PDF file size in bytes.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/current/accept:
    post:
      tags:
        - Invoices
      summary: Accept current invoice
      operationId: acceptCurrentInvoice
      description: >
        Accepts/signs the current invoice (Phase 13). Captures the customer signature
        (image/png, max 2 MB) and accepted customer name, appends a new signed current invoice
        version, regenerates the signed PDF, and automatically emails the accepted PDF to the
        order customer's email, updating last_emailed_at. Requires a current invoice that is not
        already accepted and a valid customer email. Allowed when order_status is LAID. If the
        email send fails the acceptance is still persisted (201) with last_emailed_at null; use
        Resend to retry.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignatureAcceptRequest'
            encoding:
              signature:
                contentType: image/png
      responses:
        '201':
          description: Invoice accepted (and emailed unless the send failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/current/resend:
    post:
      tags:
        - Invoices
      summary: Resend current accepted invoice
      operationId: resendCurrentInvoice
      description: >
        Re-sends the current accepted invoice PDF to the customer and updates last_emailed_at
        (Phase 13). The request body must be an empty JSON object. Requires a current invoice
        that has been accepted and a valid customer email. Does not require a new signature and
        does not create a new invoice version. Returns 502 when the email provider fails.
        Allowed when order_status is LAID.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '200':
          description: Invoice re-sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/current/signature:
    get:
      tags:
        - Invoices
      summary: Download current invoice accepted signature image
      operationId: downloadCurrentInvoiceSignature
      description: >
        Streams the accepted customer signature image (image/png) for the current invoice
        (Phase 13). Returns 404 when no invoice exists yet and 422 when the current invoice has
        not been accepted. Allowed when order_status is LAID. Not an old-version
        signature-history endpoint.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Accepted signature image streamed
          headers:
            Content-Disposition:
              description: Inline signature filename generated by backend.
              schema:
                type: string
            Content-Length:
              description: Signature file size in bytes.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/payments:
    get:
      tags:
        - Payments
      summary: List order payments
      operationId: listPayments
      description: >
        Returns paginated payment transactions for the order ordered by created_at
        descending, plus the current official payment summary. If no payments exist,
        payments is returned as an empty array. balance_due is null when no official
        invoice exists yet.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Payments returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Payments
      summary: Record payment
      operationId: recordPayment
      description: >
        Records a payment against the latest official invoice balance and atomically
        creates the next official invoice version carrying forward sale snapshot
        fields from the latest official invoice while updating only total_paid and
        balance_due. This endpoint is allowed when order status is LAID.
        Phase 15D: recording a payment NEVER emails. When the current invoice was already
        accepted, the new version still carries forward the acceptance/signature metadata
        (the customer does not re-sign) and the regenerated PDF embeds the carried
        signature, but no email is sent and last_emailed_at stays null (the dashboard
        mirror is reset to null with the new version). Manual Resend is the only email
        action after a payment change. The response message is always
        "Payment recorded. Current invoice updated." regardless of acceptance state.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreateRequest'
      responses:
        '201':
          description: Payment recorded and current invoice updated. No email is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreateResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/payments/{paymentTransactionId}/void:
    post:
      tags:
        - Payments
      summary: Void payment
      operationId: voidPayment
      description: >
        Phase 15D. Soft-voids a recorded payment (the original row is preserved, never hard
        deleted) and atomically creates the next official invoice version, exactly mirroring how
        recording a payment behaves: the voided payment is excluded from the active total_paid so
        total_paid drops and balance_due rises, sale snapshot fields are carried forward, and when
        the current invoice was accepted the acceptance/signature metadata is carried forward (the
        customer does NOT re-sign). No email is sent and last_emailed_at stays null (the dashboard
        mirror is reset to null with the new version); manual Resend remains the only email action.
        This endpoint takes no request body and is allowed when order status is LAID. The voided
        payment stays visible in payment history with voided_at and voided_by_name populated.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: paymentTransactionId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: The payment transaction to void.
      responses:
        '201':
          description: >
            Payment voided and current invoice updated (a new version is created). No email is sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentVoidResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: >
            Order not found (out of the session's business/store, ORDER_NOT_FOUND) or the payment
            does not exist for this order (PAYMENT_NOT_FOUND). Existence of another tenant's data is
            never confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '409':
          description: The payment has already been voided (PAYMENT_ALREADY_VOIDED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/workspace:
    get:
      tags:
        - Quotes
      summary: Get quote workspace
      operationId: getQuoteWorkspace
      description: >
        Loads the full quote state for the order's Quote tab (Phase 16B): the editable draft, the
        active issued version summary, and the latest accepted version summary. Cost/GP flags are
        present on this protected view only. Allowed when order_status is LAID (read).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Quote workspace state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteWorkspaceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/draft:
    put:
      tags:
        - Quotes
      summary: Upsert quote draft
      operationId: upsertQuoteDraft
      description: >
        Creates or replaces the editable quote draft (itemised flag, customer-facing lines and
        adjustments) for the order (Phase 16B). An itemised save full-replaces the draft lines:
        the server recomputes totals, enforces total == sum of lines (auto-inserting a negative
        adjustment line on a direct reduction via final_total_inc_gst) and rejects a total above
        the line sum (QUOTE_TOTAL_EXCEEDS_LINES, 422; itemised saves only). A non-itemised save
        (itemised false, final_total_inc_gst required, lines must be empty) is header-only
        (Phase 16D-B PR2A): it updates mode/totals (inc = final_total_inc_gst; ex = final / 1.10
        HALF_UP 2dp), creates NO synthetic line, and never writes or deletes quote_draft_line
        rows — lines persisted by the last itemised save are retained as dormant rows and are
        returned in the response lines[]. The non-itemised total is never validated against
        retained lines. Below-cost saves are blocked in both modes (QUOTE_BELOW_COST, 422):
        itemised uses the visible line sum, non-itemised the final-total-derived ex total. The
        quote draft is independent of order pricing: a save does NOT update the order sale-price
        override or any sales_order header financials, and quote lines never mutate the order's
        product/charge lines. Blocked when order_status is LAID (ORDER_LOCKED, 422).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteDraftUpsertRequest'
      responses:
        '200':
          description: Quote draft saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDraftResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/preview-pdf:
    post:
      tags:
        - Quotes
      summary: Preview quote draft PDF
      operationId: previewQuotePdf
      description: >
        Generates an on-demand draft quote PDF (Aire Compact style, title QUOTATION, including a display-only 40% deposit line and printable declaration/customer acceptance area) for preview.
        Not stored. Empty JSON object body. Below-cost does not block a preview (only
        save/send/accept block). Allowed when order_status is LAID (read-only render).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '200':
          description: Draft quote PDF streamed
          headers:
            Content-Disposition:
              description: Inline preview filename generated by backend.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/send-email:
    post:
      tags:
        - Quotes
      summary: Send quote by email
      operationId: sendQuoteEmail
      description: >
        Issues (or resends) the quote and emails it (issued PDF attachment + signing link + body)
        (Phase 16B). Draft changed since last issue creates a new ISSUED version that supersedes
        the previous one; draft unchanged resends the same version with a new ACTIVE token (old
        token REPLACED). Either way the issued PDF + token are stored before delivery. Re-checks
        below-cost (QUOTE_BELOW_COST, 422) and requires a valid customer email
        (CUSTOMER_EMAIL_REQUIRED / CUSTOMER_EMAIL_INVALID, 422). Blocked when LAID (ORDER_LOCKED,
        422). On provider failure returns 502 (EMAIL_SEND_FAILED); the issued version/PDF/token
        are kept and the salesperson resends.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Quote issued and emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSendResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/send-sms:
    post:
      tags:
        - Quotes
      summary: Send quote by SMS
      operationId: sendQuoteSms
      description: >
        Issues (or resends) the quote and sends an SMS containing the signing link only (no PDF)
        (Phase 16B). Same issue/resend + token logic as send-email. Requires a valid customer
        mobile (CUSTOMER_MOBILE_REQUIRED / CUSTOMER_MOBILE_INVALID, 422). Blocked when LAID
        (ORDER_LOCKED, 422). On provider failure returns 502 (SMS_SEND_FAILED); the issued
        version/PDF/token are kept and the salesperson resends.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Quote issued and SMS sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSendResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/cancel:
    post:
      tags:
        - Quotes
      summary: Cancel active issued quote
      operationId: cancelQuote
      description: >
        Cancels the active issued quote (Phase 16B): version becomes CANCELLED and the active
        token becomes CANCELLED (kept for messaging; link dead). Requires an active ISSUED version
        (QUOTE_NOT_ISSUED, 422); an already accepted quote returns 409 (QUOTE_ALREADY_ACCEPTED).
        Empty JSON object body. Allowed when LAID as a narrow exception (kills a public link only;
        not an order mutation).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '200':
          description: Quote cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSendResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/create-invoice:
    post:
      tags:
        - Quotes
      summary: Create invoice from accepted quote (Path A)
      operationId: createInvoiceFromQuote
      description: >
        Creates an invoice from the latest accepted quote (Phase 16B, Path A). The invoice sale
        price is the accepted quote snapshot total, the terms are the quote's frozen
        terms_snapshot, and the acceptance/signature is inherited (the customer does not re-sign);
        the signed invoice PDF is generated. Requires at least one ACCEPTED quote version
        (QUOTE_NOT_ACCEPTED, 422). Not blocked by an unsigned draft. Follows the existing
        invoice-create LAID rule.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Invoice created from accepted quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/pdf:
    get:
      tags:
        - Quotes
      summary: Download stored quote PDF (salesperson)
      operationId: downloadQuotePdf
      description: >
        Streams a stored quote PDF for the salesperson (Phase 16B): type=issued returns the active
        issued version PDF; type=accepted returns the accepted signed PDF. The signed PDF is
        portal only and is never served on the public surface. Missing requested artifact returns
        404 (QUOTE_PDF_NOT_FOUND). Allowed when order_status is LAID (read).
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - issued
              - accepted
      responses:
        '200':
          description: Quote PDF streamed
          headers:
            Content-Disposition:
              description: Inline quote PDF filename generated by backend.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}:
    servers:
      - url: /api/v1
    get:
      tags:
        - Quotes
      summary: Open a quote by public token
      operationId: getPublicQuote
      security: []
      description: >
        Public, token-only quote view (Phase 16B). No session; the secret token is the only
        credential and the endpoint exposes only the single quote behind it (cost-free, no
        internal IDs). Returns a state derived from the token: ACTIVE (viewable + signable),
        EXPIRED, SUPERSEDED, CANCELLED, or INACTIVE (signed; link dead, not a viewable signed
        copy). An unknown token returns 404 (QUOTE_TOKEN_NOT_FOUND). Only an ACTIVE token on an
        ISSUED quote can lazily expire on access. Rate-limited against rapid repeated access by
        token/IP (infra-level; not a documented response).
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Public quote view (with state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuoteViewWrapper'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}/viewed:
    servers:
      - url: /api/v1
    post:
      tags:
        - Quotes
      summary: Mark a public quote as viewed
      operationId: markPublicQuoteViewed
      security: []
      description: >
        Marks the quote viewed_at (Phase 16B). Idempotent; only meaningful while the token is
        ACTIVE. Empty JSON object body. Unknown token returns 404; a dead link returns 410.
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '200':
          description: View recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuoteViewWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}/accept:
    servers:
      - url: /api/v1
    post:
      tags:
        - Quotes
      summary: Accept (sign) a quote remotely
      operationId: acceptPublicQuote
      security: []
      description: >
        Customer signs the quote on their phone (Phase 16B). multipart/form-data with a signature
        image (image/png, max 2 MB); accepted_customer_name is taken server-side from the saved
        order customer (the customer does not type or edit it in MVP). On success: version becomes
        ACCEPTED, the snapshot is locked as the legal billing number, the signed quote PDF is
        stored, the token becomes CONSUMED (the public link dies), and the store is notified by
        email (post-commit, non-fatal). The token state must be ACTIVE;
        expired/superseded/cancelled/signed tokens return 410 (QUOTE_LINK_EXPIRED /
        QUOTE_LINK_SUPERSEDED / QUOTE_LINK_CANCELLED / QUOTE_LINK_INACTIVE). Unknown token returns
        404.
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteAcceptRequest'
            encoding:
              signature:
                contentType: image/png
      responses:
        '201':
          description: Quote accepted; public link now dead
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuoteAcceptResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}/pdf:
    servers:
      - url: /api/v1
    get:
      tags:
        - Quotes
      summary: Download the issued quote PDF (public)
      operationId: downloadPublicQuotePdf
      security: []
      description: >
        Streams the issued quote PDF to the customer only while the token is ACTIVE (Phase 16B).
        Cost-free. Once the token is CONSUMED (signed) or otherwise dead the endpoint returns 410;
        an unknown token returns 404. The signed PDF is never served here - it is portal only.
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Issued quote PDF streamed
          headers:
            Content-Disposition:
              description: Inline quote PDF filename generated by backend.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-side session cookie used by protected Sales Portal endpoints.

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrderStatus'
    WeekYear:
      name: week_year
      in: query
      required: false
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    WeekNumber:
      name: week_number
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 53
    Token:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: Opaque secret public quote token (not an order or quote id).

  schemas:
    AttachmentRead:
      type: object
      additionalProperties: false
      required:
        - order_attachment_id
        - attachment_kind
        - file_name
        - mime_type
        - file_size
        - download_path
        - created_at
      properties:
        order_attachment_id:
          type: integer
          format: int64
        attachment_kind:
          $ref: '#/components/schemas/AttachmentKind'
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        download_path:
          type: string
        created_at:
          $ref: '#/components/schemas/Timestamp'

    AttachmentsResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRead'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AttachmentUploadRequest:
      type: object
      additionalProperties: false
      required:
        - file
        - attachment_kind
      properties:
        file:
          type: string
          format: binary
        attachment_kind:
          $ref: '#/components/schemas/PhotoAttachmentKind'

    AttachmentResponse:
      type: object
      additionalProperties: false
      required:
        - attachment
      properties:
        attachment:
          $ref: '#/components/schemas/AttachmentRead'

    AttachmentResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AttachmentResponse'
        message:
          type: string

    AttachmentDeleteResponse:
      type: object
      additionalProperties: false
      required:
        - deleted_attachment_id
      properties:
        deleted_attachment_id:
          type: integer
          format: int64

    AttachmentDeleteResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/AttachmentDeleteResponse'
        message:
          type: string

    AvailableProduct:
      type: object
      additionalProperties: false
      required:
        - product_id
        - code
        - name
        - flooring_type
        - pricing_unit
        - price
        - sqm_per_lm
        - stock_quantity
        - stock_unit
      properties:
        product_id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        flooring_type:
          $ref: '#/components/schemas/FlooringType'
        pricing_unit:
          $ref: '#/components/schemas/PricingUnit'
        price:
          $ref: '#/components/schemas/Money'
        sqm_per_lm:
          type: number
          format: double
          example: 3.66
          description: >-
            Product conversion factor, SQM per 1 LM. Default 3.66; 4 m rolls may
            use 4.00.
        stock_quantity:
          type: number
          format: double
          nullable: true
        stock_unit:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StockUnit'

    AvailableProductsResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvailableProduct'
        pagination:
          $ref: '#/components/schemas/Pagination'

    AvailableCharge:
      type: object
      additionalProperties: false
      required:
        - charge_id
        - code
        - name
        - flooring_type
        - price
      properties:
        charge_id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        flooring_type:
          $ref: '#/components/schemas/FlooringType'
        price:
          $ref: '#/components/schemas/Money'

    AvailableChargesResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AvailableCharge'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ProductLineCreateRequest:
      type: object
      additionalProperties: false
      required:
        - product_id
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
        quantity_lm:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
        quantity_sqm:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
        unit_price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
            - type: number
              minimum: 0
              exclusiveMinimum: true
      oneOf:
        - required:
            - quantity_lm
        - required:
            - quantity_sqm
      not:
        required:
          - quantity_lm
          - quantity_sqm

    ProductLinePatchRequest:
      type: object
      additionalProperties: false
      properties:
        quantity_lm:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
        quantity_sqm:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
        unit_price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
            - type: number
              minimum: 0
              exclusiveMinimum: true
      anyOf:
        - required:
            - quantity_lm
        - required:
            - quantity_sqm
        - required:
            - unit_price
      not:
        required:
          - quantity_lm
          - quantity_sqm

    ChargeLineCreateRequest:
      type: object
      additionalProperties: false
      required:
        - charge_id
        - quantity
      properties:
        charge_id:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        unit_price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
            - type: number
              minimum: 0
              exclusiveMinimum: true

    ChargeLinePatchRequest:
      type: object
      additionalProperties: false
      properties:
        quantity:
          type: number
          format: double
          nullable: true
          minimum: 0
          exclusiveMinimum: true
        unit_price:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Money'
            - type: number
              minimum: 0
              exclusiveMinimum: true
      anyOf:
        - required:
            - quantity
        - required:
            - unit_price

    ChargeLineMutationResponse:
      type: object
      additionalProperties: false
      required:
        - charge_line
        - order_financial_summary
      properties:
        charge_line:
          $ref: '#/components/schemas/ChargeLineRead'
        order_financial_summary:
          $ref: '#/components/schemas/OrderFinancialSummary'

    ChargeLineMutationResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/ChargeLineMutationResponse'
        message:
          type: string

    ChargeLineDeleteResponse:
      type: object
      additionalProperties: false
      required:
        - deleted_charge_line_id
