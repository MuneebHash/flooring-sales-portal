  /public/invoices/{token}:
    servers:
      - url: /api/v1
    get:
      tags:
        - Invoices
      summary: Open an invoice by public link token
      operationId: getPublicInvoice
      security: []
      description: >
        16G PR 4 (planned; not implemented until PR 4 merges; the /i/{token} page is PR 5;
        docs/API-Contracts-Phase16G-Invoice-Link.md section 9). Public, slugless, token-only: no
        session is read or created, no Set-Cookie, no RequestContextGuard; the secret token is the
        only credential and only the single order's current invoice behind it is readable. The
        token identifies the ORDER: every request resolves the order's current invoice version
        (the highest version_number), so the page shows payments and voids made after the send.
        Token gate: a malformed or unknown token, or a quote token, returns 404
        INVOICE_TOKEN_NOT_FOUND "Invoice not found." (identical status, code and message); an
        ACTIVE token past expires_at takes the order row lock, is re-read and is flipped to
        EXPIRED in its own committed transaction (no invoice row changes). A found token always
        returns 200 with a state - there is no 410 on this GET. The token status, the order, the
        current version and the business presentation are then read in ONE read-only
        REPEATABLE_READ snapshot, so the state and the content come from the same committed
        moment; a token killed between the gate and the snapshot is reported in its dead state,
        never with ACTIVE content. An ACTIVE token whose current version is signed breaks the
        never-signable-when-signed invariant: 500 with the generic error envelope and no content.
        ACTIVE returns the document (PublicInvoiceView); a dead state (REPLACED, REWRITTEN,
        SIGNED, EXPIRED) returns only state, business_name and its message, every other field
        null. No viewed tracking: nothing is stamped on a read. Cost-free and id-free (see
        PublicInvoiceView). Rate limiting is not implemented (Phase 17, #128, to be widened to
        these endpoints); no 429 response is documented.
      parameters:
        - $ref: '#/components/parameters/InvoiceToken'
      responses:
        '200':
          description: >-
            Public invoice view with its state (ACTIVE document or dead-state payload). Message
            "Invoice loaded."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInvoiceViewWrapper'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/invoices/{token}/accept:
    servers:
      - url: /api/v1
    post:
      tags:
        - Invoices
      summary: Accept (sign) the current invoice remotely
      operationId: acceptPublicInvoice
      security: []
      description: >
        16G PR 4 (planned; docs/API-Contracts-Phase16G-Invoice-Link.md sections 9.4 and 10). The
        customer signs the invoice version the page shows. multipart/form-data with exactly two
        parts: expected_version_number (the version_number shown) and signature (see
        PublicInvoiceAcceptRequest). No name, declaration flags or money values are accepted; the
        two declarations are a frontend-only gate. Order of checks (nothing persists on a refusal
        except a committed expiry flip): (0) transport, in the framework: over the multipart limit
        400 FILE_TOO_LARGE; not multipart 415 (code VALIDATION_FAILED). (1) Token gate, in its own
        transaction: unknown or malformed 404 INVOICE_TOKEN_NOT_FOUND; past expiry the flip
        commits, then 410 INVOICE_LINK_EXPIRED; any other dead status 410 with its code
        (INVOICE_LINK_REPLACED, INVOICE_LINK_REWRITTEN, INVOICE_LINK_SIGNED) - a dead link with an
        invalid body still gets its 410. (2) Body validation with no database access and no lock:
        one 400 VALIDATION_FAILED listing every offending part (an unknown part "Not allowed.", a
        repeated part "Must appear at most once.", a missing expected_version_number "Required.",
        a malformed one "Must be a positive integer."); then a missing or empty signature 422
        SIGNATURE_REQUIRED (default message); then a declared type that is not image/png, over
        2097152 bytes or a PNG outside the rules 400 SIGNATURE_INVALID (default message). (3) One
        transaction under the order row lock (an unscoped SELECT ... FOR UPDATE on the token's
        order, which serialises with every protected order mutation): the token re-read by id
        (dead: 410 for its true state; past expiry: flip committed, then 410
        INVOICE_LINK_EXPIRED); the current version read; the stale comparison
        (expected_version_number not equal to the current version_number: 409
        INVOICE_VERSION_STALE "Invoice updated, please refresh" - the authority; the earlier
        token read and any page check are only hints); the invariant (a signed current version
        under an ACTIVE token: 500, nothing written); the current version's frozen
        customer_name_snapshot null or blank: 422 ACCEPTED_CUSTOMER_NAME_REQUIRED with "This
        invoice can no longer be accepted online. Please contact the store." (the only
        business-rule refusal; there is no customer-email gate). Then persist, file-write-first:
        the normalised signature PNG (signature-{order_number}-v{N}.png) and the signed invoice
        PDF (invoice-{order_number}-v{N}.pdf) with their stored_file rows; version N = current + 1
        appended (16G PR 4, with the in-store persistence from 16G PR 3: invoice_date, due date,
        details, totals, paid, balance, source quote version, terms_snapshot and the three frozen
        identity columns copied from the current version, so the stored and emailed signed PDF
        shows the invoice date of the version the customer reviewed; accepted_at now, the signing
        time; accepted_customer_name = the frozen name, verbatim, full length;
        created_by_user_id = the staff user who sent the link; last_emailed_at null); the
        sales_order.last_emailed_at mirror reset to null; the token ACTIVE -> SIGNED (dead_at =
        accepted_at); an ISSUED quote version and its ACTIVE quote token CANCELLED (16F D5(c),
        extended). No order price, status, line, draft or payment change. Any failure rolls back
        every write and deletes only this request's files; the token stays ACTIVE. (4) After
        commit only, never throwing: the signed PDF is emailed to the saved customer email (a
        missing or invalid email skips the send with a WARN log; success stamps the version's
        last_emailed_at and the mirror; failure leaves both null), and a text-only store
        notification goes to the order's store email (InvoiceAcceptanceNotificationSender,
        subject "Invoice accepted: {order_number}"; blank store email skipped with WARN; failure
        WARN only; never stamps any marker). Both are recording-only until Phase 17, and neither
        is sent for a rolled-back, stale or refused request. Allowed when order_status is LAID;
        no CANCELLED rule. Rate limiting: Phase 17 (#128).
      parameters:
        - $ref: '#/components/parameters/InvoiceToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicInvoiceAcceptRequest'
            encoding:
              signature:
                contentType: image/png
      responses:
        '201':
          description: >-
            Invoice signed; the link is now dead. data.state is always SIGNED and message is
            "Invoice accepted." - no id, amount, name, timestamp, file reference or token is
            returned, and the email outcome is never reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicInvoiceAcceptResultWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            INVOICE_VERSION_STALE, message exactly "Invoice updated, please refresh": the
            current invoice version is not the expected_version_number sent. The page re-reads
            the link, clears the pad and the ticks, shows the message and waits for a fresh
            signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '410':
          $ref: '#/components/responses/InvoiceLinkGone'
        '415':
          description: >-
            Not multipart/form-data (transport-level rejection by the framework, before the token
            gate); error.code VALIDATION_FAILED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/invoices/{token}/pdf:
    servers:
      - url: /api/v1
    get:
      tags:
        - Invoices
      summary: Download the stored PDF of the invoice version shown (public)
      operationId: downloadPublicInvoicePdf
      security: []
      description: >
        16G PR 4 (planned; docs/API-Contracts-Phase16G-Invoice-Link.md section 9.5). Streams the
        stored PDF of the version the page shows, only while the link is ACTIVE; never
        regenerated, and no other version is reachable (no history on the public surface). Order:
        token gate (404 INVOICE_TOKEN_NOT_FOUND; lazy expiry; 410 for a dead link); the
        version_number query parameter (missing "Required.", not a positive integer "Must be a
        positive integer.": 400 VALIDATION_FAILED); then one read-only snapshot of the token
        status (dead: 410), the current version and its stored file row: version_number not
        equal to the current version gives 409 INVOICE_VERSION_STALE "Invoice updated, please
        refresh", so a payment or void between page load and preview makes the page re-read
        instead of opening another version's PDF. 200 streams the stored bytes verbatim with
        Content-Disposition inline; filename="invoice-{order_number}-v{version_number}.pdf". A
        file missing on disk gives 500. Rate limiting: Phase 17 (#128).
      parameters:
        - $ref: '#/components/parameters/InvoiceToken'
        - name: version_number
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: The version_number of the invoice the page shows (PublicInvoiceView.version_number).
      responses:
        '200':
          description: Stored invoice PDF streamed
          headers:
            Content-Disposition:
              description: Inline invoice PDF filename, invoice-{order_number}-v{version_number}.pdf.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            INVOICE_VERSION_STALE, message exactly "Invoice updated, please refresh": the version
            requested is no longer the current version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '410':
          $ref: '#/components/responses/InvoiceLinkGone'
        '500':
          $ref: '#/components/responses/InternalServerError'

