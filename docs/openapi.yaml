        type: integer
        minimum: 1
        maximum: 53
    Token:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: Opaque secret public quote token (not an order or quote id).
    InvoiceToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: >
        16G PR 4 (planned). Opaque secret public invoice token (not an order, invoice or quote id):
        43 to 128 characters of [A-Za-z0-9_-] (a minted token is 32 random bytes as unpadded
        URL-safe Base64, 43 characters). A value of any other shape, a quote token, or an unknown
        token gives 404 INVOICE_TOKEN_NOT_FOUND "Invoice not found." with no database access for a
        bad shape. Never logged at INFO or above.
    BusinessSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
      description: Business slug (tenant key), as in the protected /api/v1/{slug} server URL.
    QuoteVersionId:
      name: quoteVersionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      description: >
        16G PR 6 (planned, #122). The quote_version_id the Accepted Quote view displays
        (accepted.quote_version_id). Only an ACCEPTED version of the order in scope is served;
        anything else is 404.

