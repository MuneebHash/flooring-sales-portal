    PublicQuoteView:
      type: object
      additionalProperties: false
      required:
        - state
        - business_name
      description: >
        Public, token-only quote view. Phase 16E-C extends the original 16B shape ADDITIVELY with
        the document fields the public quote page renders (Quotation To, Details of Sale, totals
        breakdown, deposit) — all nullable, populated only when state is ACTIVE. Quote content
        (lines or single amount, totals, terms, details of sale, flooring type) and the
        Quotation To customer name + billing lines come from the issued snapshot frozen at issue;
        since V17 the customer identity is read from the version's customer snapshot columns,
        never the live customer record. The deposit is computed at request time as the hardcoded
        40% of the frozen inc-GST total (not stored on the version; #112 is future work).
        order_number (from the order row) and expires_at (from the presented token) are also read
        at request time, not snapshot fields. The approved business presentation context (business
        name, logo, accent, ABN, direct-deposit bank fields, Stripe payment link) is read LIVE
        from the tenant's current settings, so after a business-settings change it can differ
        from the stored issued PDF. Still cost-free, GP-free and
        internal-ID-free: order_number is the business-facing document number already printed on
        the delivered PDF, not an internal id. A non-ACTIVE state returns the minimal payload
        (state, business_name, message; every document field null).
      properties:
        state:
          $ref: '#/components/schemas/PublicQuoteState'
        business_name:
          type: string
          description: Business display name, read live from current business settings.
        business_logo_url:
          type: string
          nullable: true
          description: Business logo path, read live from current business settings.
        accent_color:
          type: string
          nullable: true
          description: Business accent colour, read live from current business settings.
        business_abn:
          type: string
          nullable: true
          description: >-
            Business ABN, read live from current business settings (the same source the issued PDF
            used when it was generated, so it can differ from the stored PDF after a settings
            change); present when state is ACTIVE.
        payment_account_name:
          type: string
          nullable: true
          description: >-
            Direct-deposit account name, read live from current business settings (may differ from
            the stored issued PDF after a settings change); present when state is ACTIVE.
        payment_bank_name:
          type: string
          nullable: true
          description: >-
            Direct-deposit bank name, read live from current business settings (may differ from the
            stored issued PDF after a settings change); present when state is ACTIVE.
        payment_bsb:
          type: string
          nullable: true
          description: >-
            Direct-deposit BSB, read live from current business settings (may differ from the stored
            issued PDF after a settings change); present when state is ACTIVE.
        payment_account_number:
          type: string
          nullable: true
          description: >-
            Direct-deposit account number, read live from current business settings (may differ
            from the stored issued PDF after a settings change); present when state is ACTIVE.
        payment_stripe_link_url:
          type: string
          nullable: true
          description: >-
            Tenant Stripe payment-link URL as used by the Payments tab (HTTPS only), read live from
            current business settings; present when state is ACTIVE.
        order_number:
          type: string
          nullable: true
          description: Document number under the QUOTATION title; present when state is ACTIVE.
        flooring_type:
          allOf:
            - $ref: '#/components/schemas/FlooringType'
          nullable: true
          description: The frozen flooring_type_snapshot; present when state is ACTIVE.
        customer_name:
          type: string
          nullable: true
          description: >-
            Quotation To — the customer name frozen at issue (V17 customer_name_snapshot), never
            the live customer record; present when state is ACTIVE.
        customer_address_line1:
          type: string
          nullable: true
          description: >-
            Quotation To billing address line 1, frozen at issue (V17 snapshot); present when state
            is ACTIVE.
        customer_address_line2:
          type: string
          nullable: true
          description: >-
            Quotation To billing address line 2, frozen at issue (V17 snapshot); present when state
            is ACTIVE.
        details_of_sale:
          type: string
          nullable: true
          description: The frozen details_of_sale_snapshot; present when state is ACTIVE.
        itemised:
          type: boolean
          nullable: true
          description: Present when state is ACTIVE.
        lines:
          type: array
          nullable: true
          description: >
            Present when state is ACTIVE and itemised (frozen issued snapshot lines in display
            order); always an empty array for an ACTIVE non-itemised quote (a non-itemised issue
            snapshots zero lines).
          items:
            $ref: '#/components/schemas/PublicQuoteLine'
        quote_total_ex_gst:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Subtotal ex GST from the frozen snapshot; present when state is ACTIVE.
        gst_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Server-computed inc − ex (issued-PDF math); present when state is ACTIVE.
        quote_total_inc_gst:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: Present when state is ACTIVE.
        deposit_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
          description: >
            Display-only deposit, computed at request time as the hardcoded 40% of the frozen
            inc-GST total (same HALF_UP 2dp math as the issued PDF); present when state is ACTIVE.
            Not stored as a field on quote_version (the amount does appear in the stored issued
            PDF). The percentage is not frozen on the version; a per-business, issue-frozen
            percentage is future work (#112, Batch B).
        terms_html:
          type: string
          nullable: true
          description: Frozen, sanitized terms HTML; present when state is ACTIVE.
        expires_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        message:
          type: string
          nullable: true
          description: Customer-facing message for non-ACTIVE states.

    PublicQuoteViewWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PublicQuoteView'
        message:
          type: string

    QuoteAcceptRequest:
      type: object
      additionalProperties: false
      required:
        - signature
      properties:
        signature:
          type: string
          format: binary
          description: >
            Customer signature image (implemented 16F PR1). The ONLY part: any other file part,
            form field or request parameter, or a second signature part, is rejected (400
            VALIDATION_FAILED). Missing or empty returns 422 (SIGNATURE_REQUIRED). PNG only: the
            declared content type must be image/png and the size at most 2 MB (2097152 bytes;
            exactly 2097152 is allowed); the bytes must start with the 8-byte PNG signature, the
            first chunk must be a 13-byte IHDR, and the IHDR (checked before any pixel is decoded)
            must be within the safe-decode bounds - at most 8192 px per side, at most 4000000 px in
            total, bit depth at most 8 (16-bit PNGs are rejected) and a valid PNG colour type - and
            the PNG reader must decode it; otherwise 400 (SIGNATURE_INVALID). Server normalisation:
            the decoded pixels are re-encoded as a clean PNG and only those bytes are stored and
            embedded in the signed PDF - same dimensions and pixels as the upload, but ancillary
            chunks and any bytes after IEND are dropped, so the stored signature (and the protected
            downloadAcceptedQuoteSignature response) is not byte-identical to the upload.
            accepted_customer_name is NOT a part: it is taken server-side from the issued version's
            frozen V17 customer_name_snapshot (16F decision D1), never the live customer record.

    PublicQuoteAcceptResult:
      type: object
      additionalProperties: false
      required:
        - state
      properties:
        state:
          $ref: '#/components/schemas/PublicQuoteState'

    PublicQuoteAcceptResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/PublicQuoteAcceptResult'
        message:
          type: string

