openapi: 3.0.3
info:
  title: Sales Portal MVP API
  version: 1.0.0
  description: Generated from locked Phase 4 API conventions and Chunk 1–4 contracts.

servers:
  - url: /api/v1/{slug}
    variables:
      slug:
        default: aussie-floors-group
        description: Business slug tenant key resolved by the backend.

security:
  - SessionCookieAuth: []

tags:
  - name: Auth
  - name: Dashboard
  - name: Orders
  - name: Customer
  - name: Addresses
  - name: DetailsOfSale
  - name: Catalog
  - name: Lines
  - name: Financials
  - name: Notes
  - name: Attachments
  - name: Invoices
  - name: Payments

paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login
      operationId: login
      security: []
      description: >
        Business is resolved from the URL slug. Login uses salesperson_code and password.
        On success, the server creates a server-side session cookie (no JWT). Single-store
        users receive active_store_id immediately. Multi-store users receive
        store_selection_required as true and active_store_id as null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/select-store:
    post:
      tags:
        - Auth
      summary: Select active store
      operationId: selectStore
      description: >
        Session is required, but an active store in session is not required on entry.
        The user must belong to the business resolved from slug. The requested store
        must belong to that business and the user must have access. Re-selecting the
        same store returns 200 idempotently. Selecting a different store after one is
        already selected returns 409 STORE_ALREADY_SELECTED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelectStoreRequest'
      responses:
        '200':
          description: Store selected or idempotent same-store reselect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectStoreResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      operationId: logout
      description: >
        Session is required. Active store in session is not required. The server
        invalidates the server-side session and clears the session cookie.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullDataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders:
    get:
      tags:
        - Dashboard
      summary: List dashboard orders
      operationId: listDashboardOrders
      description: >
        Standard protected endpoint. Data is scoped to the active (business_id, store_id).
        Empty results return 200 with an empty data array. Default ordering is
        sales_order.created_at descending. Search is case-insensitive partial match across
        sales_order.order_number, order_customer.first_name, order_customer.last_name,
        order_customer.email, and order_customer.company_name. CANCELLED orders are
        included unless filtered out. No sort query parameter in MVP. Status filter is a
        single enum value only.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/WeekYear'
        - $ref: '#/components/parameters/WeekNumber'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOrdersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Orders
      summary: Create order
      operationId: createOrder
      description: >
        Creates a new order shell. No customer, address, details-of-sale, or lines
        are required at creation time. The backend sets business_id, store_id, and
        user_id from the active session; the client never sends business_id,
        store_id, or user_id. The backend generates order_sequence_number,
        order_number, week_year, and week_number. order_status defaults to LEAD.
        supply_only defaults to false. locked is derived and false on creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get order workspace
      operationId: getOrder
      description: >
        Returns the Chunk 2 workspace state: header, customer, installation
        address, billing address, details of sale, and persisted financial readback.
        This is read-only and is allowed even when order_status is LAID. The order
        must belong to the session business/store; cross-store or cross-business
        misses return 404 ORDER_NOT_FOUND. This endpoint does not include live
        order_financial_summary; that belongs to Chunk 3 mutation responses.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderWorkspaceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/status:
    patch:
      tags:
        - Dashboard
      summary: Update order status
      operationId: updateOrderStatus
      description: >
        Dashboard-only status change on a standard protected endpoint. The order must
        belong to the session business and store. Any status can change to any other
        status. Setting LAID locks the order. Changing away from LAID unlocks the order.
        Sending the same status returns 200 as a no-op. Cross-store or cross-business
        misses return 404 ORDER_NOT_FOUND.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Status updated or no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusUpdateResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/customer:
    put:
      tags:
        - Customer
      summary: Save order customer
      operationId: saveOrderCustomer
      description: >
        Creates or replaces the single customer row for an order. PUT is a full
        replacement for customer fields. Optional fields omitted in the request are
        written as null. There is one customer row per order. This endpoint is
        blocked when the order is LAID and returns 422 ORDER_LOCKED. The order must
        belong to the session business/store.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpsertRequest'
      responses:
        '200':
          description: Customer created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/addresses/installation:
    put:
      tags:
        - Addresses
      summary: Save installation address
      operationId: saveInstallationAddress
      description: >
        Creates or replaces the installation address. The path determines
        address_type = INSTALLATION and address_type is not accepted in the request
        body. PUT is a full replacement for address fields. Optional unit_number
        omitted in the request is written as null. This endpoint is blocked when the
        order is LAID and returns 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpsertRequest'
      responses:
        '200':
          description: Installation address created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationAddressResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/addresses/billing:
    put:
      tags:
        - Addresses
      summary: Save billing address
      operationId: saveBillingAddress
      description: >
        Creates or replaces the billing address. The path determines
        address_type = BILLING and address_type is not accepted in the request body.
        PUT is a full replacement for address fields. Optional unit_number omitted
        in the request is written as null. This endpoint is blocked when the order
        is LAID and returns 422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressUpsertRequest'
      responses:
        '200':
          description: Billing address created or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddressResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/addresses/billing/copy-from-installation:
    post:
      tags:
        - Addresses
      summary: Copy installation address to billing
      operationId: copyBillingAddressFromInstallation
      description: >
        The backend copies the existing installation address into the billing
        address. No request body is required. If no installation
        address exists, the endpoint returns 422 INSTALLATION_ADDRESS_REQUIRED. If a
        billing address exists it is replaced; if it does not exist it is created.
        Copied fields are unit_number, street_number, street, suburb, state_code,
        and postcode. This endpoint is blocked when the order is LAID and returns
        422 ORDER_LOCKED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Billing address copied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddressResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/details-of-sale:
    put:
      tags:
        - DetailsOfSale
      summary: Save details of sale
      operationId: saveDetailsOfSale
      description: >
        Updates non-line, non-payment details-of-sale fields on sales_order. PUT is
        a full replacement for the fields this endpoint owns. Required fields not
        present return 400. Optional fields omitted in the request are written as
        null. This endpoint does not include order_financial_summary because these
        fields do not affect financials. Sale price override and Reset Price belong
        to Chunk 3. This endpoint is blocked when the order is LAID and returns 422
        ORDER_LOCKED. proposed_lay_date and lay_date_status must be either both
        null/omitted or both non-null.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetailsOfSaleRequest'
      responses:
        '200':
          description: Details of sale saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailsOfSaleResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Server-side session cookie used by protected Sales Portal endpoints.

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    LineId:
      name: lineId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Status:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/OrderStatus'
    WeekYear:
      name: week_year
      in: query
      required: false
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    WeekNumber:
      name: week_number
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 53

  schemas:
    EmptyObjectRequest:
      type: object
      additionalProperties: false

    UserSummary:
      type: object
      additionalProperties: false
      required:
        - user_id
        - first_name
        - last_name
        - salesperson_code
      properties:
        user_id:
          type: integer
          format: int64
        first_name:
          type: string
        last_name:
          type: string
        salesperson_code:
          type: string

    StoreSummary:
      type: object
      additionalProperties: false
      required:
        - store_id
        - name
        - store_code
      properties:
        store_id:
          type: integer
          format: int64
        name:
          type: string
        store_code:
          type: string

    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - salesperson_code
        - password
      properties:
        salesperson_code:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - stores
        - active_store_id
        - store_selection_required
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        stores:
          type: array
          items:
            $ref: '#/components/schemas/StoreSummary'
        active_store_id:
          type: integer
          format: int64
          nullable: true
        store_selection_required:
          type: boolean

    LoginResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/LoginResponse'
        message:
          type: string

    SelectStoreRequest:
      type: object
      additionalProperties: false
      required:
        - store_id
      properties:
        store_id:
          type: integer
          format: int64
          minimum: 1

    SelectStoreResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - active_store
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        active_store:
          $ref: '#/components/schemas/StoreSummary'

    SelectStoreResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/SelectStoreResponse'
        message:
          type: string

    DashboardCustomer:
      type: object
      additionalProperties: false
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string

    DashboardInstallAddress:
      type: object
      additionalProperties: false
      required:
        - unit_number
        - street_number
        - street
        - suburb
        - state_code
        - postcode
      properties:
        unit_number:
          type: string
          nullable: true
        street_number:
          type: string
        street:
          type: string
        suburb:
          type: string
        state_code:
          type: string
        postcode:
          type: string

    DashboardOrderRow:
      type: object
      additionalProperties: false
      required:
        - order_id
        - order_number
        - order_sequence_number
        - flooring_type
        - order_status
        - customer
        - install_address
        - last_emailed_at
        - week_year
        - week_number
        - gp
        - gp_percent
        - gp_warning
      properties:
        order_id:
          type: integer
          format: int64
        order_number:
          type: string
        order_sequence_number:
          type: integer
        flooring_type:
          $ref: '#/components/schemas/FlooringType'
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        customer:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DashboardCustomer'
        install_address:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/DashboardInstallAddress'
        last_emailed_at:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          nullable: true
        week_year:
          type: integer
        week_number:
          type: integer
        gp:
          allOf:
            - $ref: '#/components/schemas/Money'
          nullable: true
        gp_percent:
          type: number
          format: double
          nullable: true
          example: 48.57
        gp_warning:
          type: boolean

    DashboardOrdersResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DashboardOrderRow'
        pagination:
          $ref: '#/components/schemas/Pagination'

    OrderStatusUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - order_status
      properties:
        order_status:
          $ref: '#/components/schemas/OrderStatus'

    OrderStatusUpdateResponse:
      type: object
      additionalProperties: false
      required:
        - order_id
        - order_number
        - order_status
        - previous_order_status
        - locked
        - updated_at
      properties:
        order_id:
          type: integer
          format: int64
        order_number:
          type: string
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        previous_order_status:
          $ref: '#/components/schemas/OrderStatus'
        locked:
          type: boolean
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    OrderStatusUpdateResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/OrderStatusUpdateResponse'
        message:
          type: string

    CreateOrderRequest:
      type: object
      additionalProperties: false
      required:
        - flooring_type
      properties:
        flooring_type:
          $ref: '#/components/schemas/FlooringType'

    OrderHeader:
      type: object
      additionalProperties: false
      required:
        - order_id
        - order_number
        - order_sequence_number
        - flooring_type
        - order_status
        - supply_only
        - plan_numbers
        - proposed_lay_date
        - lay_date_status
        - details_of_sale
        - last_emailed_at
        - week_year
        - week_number
        - created_at
        - updated_at
        - locked
      properties:
        order_id:
          type: integer
          format: int64
        order_number:
          type: string
        order_sequence_number:
          type: integer
        flooring_type:
          $ref: '#/components/schemas/FlooringType'
        order_status:
          $ref: '#/components/schemas/OrderStatus'
        supply_only:
          type: boolean
        plan_numbers:
          type: string
          nullable: true
        proposed_lay_date:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Date'
        lay_date_status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LayDateStatus'
        details_of_sale:
          type: string
          nullable: true
        last_emailed_at:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        week_year:
          type: integer
        week_number:
          type: integer
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        locked:
          type: boolean

    CreateOrderResponseWrapper:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: '#/components/schemas/OrderHeader'
        message:
          type: string

    OrderCustomer:
      type: object
      additionalProperties: false
      required:
        - first_name
        - middle_name
        - last_name
        - email
        - mobile
        - home_phone
        - work_phone
        - company_name
      properties:
        first_name:
          type: string
        middle_name:
          type: string
          nullable: true
        last_name:
          type: string
        email:
          type: string
        mobile:
          type: string
        home_phone:
          type: string
          nullable: true
        work_phone:
          type: string
          nullable: true
        company_name:
          type: string
          nullable: true

    OrderAddress:
      type: object
      additionalProperties: false
      required:
        - unit_number
        - street_number
        - street
        - suburb
        - state_code
        - postcode
      properties:
        unit_number:
          type: string
          nullable: true
        street_number:
          type: string
        street:
          type: string
        suburb:
          type: string
        state_code:
          type: string
        postcode:
          type: string

    PersistedFinancials:
      type: object
      additionalProperties: false
      required:
        - sale_price_ex_gst
        - total_cost
        - gp
        - gp_percent
      properties:
        sale_price_ex_gst:
