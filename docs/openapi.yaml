    SignatureAcceptRequest:
      type: object
      additionalProperties: false
      description: >-
        In-store invoice acceptance (D.8) multipart parts, as the TARGET contract from 16G PR 3
        (#69): exactly one expected_version_number form field and one signature file; anything
        else, including accepted_customer_name, is 400 VALIDATION_FAILED ("Not allowed."). UNTIL
        16G PR 3 MERGES the server takes accepted_customer_name (form field, 1-150 characters, not
        blank; the Invoice tab derives it from the saved customer) plus signature, and has no
        expected_version_number part. From PR 3 the accepted name is the current version's frozen
        customer_name_snapshot, with no 150-character limit.
      required:
        - expected_version_number
        - signature
      properties:
        expected_version_number:
          type: integer
          minimum: 1
          description: >-
            16G PR 3 (planned, #69). Mandatory form field, exactly once: the version_number of the
            invoice on screen. Compared under the order lock with the current invoice's
            version_number; never used to look up a row. Missing: 400 VALIDATION_FAILED
            "Required."; not a positive integer: "Must be a positive integer."; repeated: "Must
            appear at most once."; a mismatch: 409 INVOICE_VERSION_STALE "Invoice updated, please
            refresh".
        signature:
          type: string
          format: binary
          description: >
            Customer signature image. PNG only (image/png), non-empty, max 2 MB
            (2097152 bytes). Phase 13. D.8 checks the declared type and size; PNG content checks
            are a proposed follow-up (16G contract section 17, F55).


