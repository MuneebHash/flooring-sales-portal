        null); the customer must re-accept. Rewrite sends NO email. Returns 422 when rewrite
        is blocked (including LAID order lock, missing first invoice, or failed preconditions).
        16G PR 2 (#125): the new version freezes the current Invoice To name, billing lines and
        per-flooring-type terms, as createInvoice does (terms_source BUSINESS; the source quote
        version is cleared). 16G PR 4 (planned): in the same transaction an ACTIVE
        invoice link becomes REWRITTEN (the customer's page then shows "This invoice has been
        revised. Please contact the store for the updated invoice."). Rewrite gains no
        expected-version precondition in 16G.
