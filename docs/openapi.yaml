    OrderEnquiry:
      type: object
      additionalProperties: false
      description: >-
        Phase 15F lead enquiry — the one-per-order order_enquiry row. Embedded as
        the nullable `enquiry` object on the workspace read and returned under
        data.enquiry on save.
      required:
        - lead_type
        - carpet
        - hard_floor
        - product_fit_timing
        - product_usage_context
        - rooms_to_cover
        - textured_or_plain
        - light_or_dark_tones
        - colours_interested
        - current_flooring_and_reason
        - products_discussed
        - fully_installed
        - uplift
        - furniture
        - stairs
        - subfloor_concrete
        - subfloor_timber
        - subfloor_tile
        - brief_summary
      properties:
        lead_type:
          nullable: true
          description: >-
            How the lead came in — single choice (FLOOR / PHONE / INTERNET) or null
            = unanswered. An invalid value is a 400 VALIDATION_FAILED on field
            lead_type (exact case only; never silently coerced).
          allOf:
            - $ref: '#/components/schemas/LeadType'
        carpet:
          type: boolean
          description: >-
            A product the customer is looking for. Independent of hard_floor and
            of the order's SOFT/HARD flooring_type (both/neither may be true).
        hard_floor:
          type: boolean
          description: >-
            A product the customer is looking for. Independent of carpet and of
            the order's SOFT/HARD flooring_type (both/neither may be true).
        product_fit_timing:
          type: string
          nullable: true
        product_usage_context:
          type: string
          nullable: true
        rooms_to_cover:
          type: string
          nullable: true
        textured_or_plain:
          type: string
          nullable: true
        light_or_dark_tones:
          type: string
          nullable: true
        colours_interested:
          type: string
          nullable: true
        current_flooring_and_reason:
          type: string
          nullable: true
        products_discussed:
          type: string
          nullable: true
        fully_installed:
          type: boolean
          nullable: true
          description: 'Tri-state: true = Yes, false = No, null = unanswered.'
        uplift:
          type: boolean
          nullable: true
          description: 'Tri-state: true = Yes, false = No, null = unanswered.'
        furniture:
          type: boolean
          nullable: true
          description: 'Tri-state: true = Yes, false = No, null = unanswered.'
        stairs:
          type: boolean
          nullable: true
          description: 'Tri-state: true = Yes, false = No, null = unanswered.'
        subfloor_concrete:
          type: boolean
          description: Independent multi-select subfloor flag (any combination, incl. none).
        subfloor_timber:
          type: boolean
          description: Independent multi-select subfloor flag (any combination, incl. none).
        subfloor_tile:
          type: boolean
          description: Independent multi-select subfloor flag (any combination, incl. none).
        brief_summary:
          type: string
          nullable: true

    EnquiryUpsertRequest:
      type: object
      additionalProperties: false
      description: >-
        Full-replace body for PUT /orders/{orderId}/enquiry. No field is required:
        omitted text is written as null, omitted NOT NULL flags (carpet, hard_floor,
        subfloor_*) default to false, omitted tri-state fields (fully_installed,
        uplift, furniture, stairs) are written as null (unanswered), and an omitted
        lead_type is written as null. lead_type must be FLOOR / PHONE / INTERNET or
        null/blank — any other value is a 400 VALIDATION_FAILED on field lead_type.
        No business_id/store_id/order_id is accepted — order_id comes from the path.
      properties:
        lead_type:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/LeadType'
        carpet:
          type: boolean
        hard_floor:
          type: boolean
        product_fit_timing:
          type: string
          nullable: true
        product_usage_context:
          type: string
          nullable: true
        rooms_to_cover:
          type: string
          nullable: true
        textured_or_plain:
          type: string
          nullable: true
        light_or_dark_tones:
          type: string
          nullable: true
        colours_interested:
          type: string
          nullable: true
        current_flooring_and_reason:
          type: string
          nullable: true
        products_discussed:
          type: string
          nullable: true
        fully_installed:
          type: boolean
          nullable: true
        uplift:
          type: boolean
          nullable: true
        furniture:
          type: boolean
          nullable: true
        stairs:
          type: boolean
          nullable: true
        subfloor_concrete:
          type: boolean
        subfloor_timber:
          type: boolean
        subfloor_tile:
          type: boolean
        brief_summary:
          type: string
          nullable: true

