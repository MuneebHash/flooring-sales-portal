        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/send-email:
    post:
      tags:
        - Quotes
      summary: Send quote by email
      operationId: sendQuoteEmail
      description: >
        Issues (or resends) the quote and emails the public quote link (Phase 16B; implemented
        16E-A). Link-only since 16F PR1: a short plain-text body carrying the public quote link
        exactly once and NO PDF attachment (16E-A attached the issued PDF). The immutable issued PDF
        is still generated and stored when a new version is issued; the customer opens it from the
        public page (GET /public/quotes/{token}/pdf) and the salesperson via
        GET /orders/{orderId}/quote/pdf?type=issued. The link's token is the credential for the
        public view, viewed, PDF and accept endpoints (acceptPublicQuote implemented 16F PR1; the
        public signing UI is planned 16F PR3). A draft or customer name/billing change since the
        last issue (compared with the V17 issue-time snapshot), or no active ISSUED version at all
        (never sent, cancelled, expired or accepted), creates a new ISSUED version (next
        version_number) that supersedes any previous ISSUED one; otherwise the same version is
        re-sent with a new ACTIVE token (old token REPLACED) and its stored PDF is kept as is
        (never regenerated). Either way the issued version, its stored PDF and the new token are
        persisted before delivery. Sending after an acceptance is allowed (16F decision D9): it
        issues a new version that needs a new signature and never changes the ACCEPTED version. A
        send never writes the order sale price (only acceptPublicQuote does, decision D6b). In the
        current build delivery is recorded in memory only - no real email is sent. Re-checks
        below-cost (QUOTE_BELOW_COST, 422) and requires a valid customer email
        (CUSTOMER_EMAIL_REQUIRED / CUSTOMER_EMAIL_INVALID, 422). Blocked when LAID (ORDER_LOCKED,
        422). On provider failure returns 502 (EMAIL_SEND_FAILED); the issued version/PDF/token
        are kept and the salesperson resends.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Quote issued and emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSendResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/send-sms:
    post:
      tags:
        - Quotes
      summary: Send quote by SMS
      operationId: sendQuoteSms
      description: >
        DORMANT - existing backend support that is excluded from the approved delivery roadmap
        (delivery is email only). The frontend never calls it and no SMS provider exists
        (in-memory recording sender only); the definition is kept, not promised.
        Issues (or resends) the quote and sends an SMS containing the public quote link only (no
        PDF) (Phase 16B). Same issue/resend + token logic as send-email. Requires a valid customer
        mobile (CUSTOMER_MOBILE_REQUIRED / CUSTOMER_MOBILE_INVALID, 422). Blocked when LAID
        (ORDER_LOCKED, 422). On provider failure returns 502 (SMS_SEND_FAILED); the issued
        version/PDF/token are kept and the salesperson resends.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Quote issued and SMS sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSendResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/cancel:
    post:
      tags:
        - Quotes
      summary: Cancel active issued quote
      operationId: cancelQuote
      description: >
        Cancels the active issued quote (Phase 16B): version becomes CANCELLED and the active
        token becomes CANCELLED (kept for messaging; link dead). Requires an active ISSUED version:
        with none, an order that has an ACCEPTED quote version returns 409
        (QUOTE_ALREADY_ACCEPTED - reachable since 16F PR1 creates ACCEPTED versions), otherwise 422
        (QUOTE_NOT_ISSUED). An ISSUED version sent after an acceptance is cancelled normally; an
        ACCEPTED version is never touched. Never writes the order sale price. Empty JSON object
        body. Allowed when LAID as a narrow exception (kills a public link only; not an order
        mutation).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '200':
          description: Quote cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSendResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/create-invoice:
    post:
      tags:
        - Quotes
      summary: Create invoice from accepted quote (Path A)
      operationId: createInvoiceFromQuote
      description: >
        PLANNED 16F PR2 - NOT IMPLEMENTED at this base (no handler exists; this definition is the
        contract 16F PR2 builds to).
        Creates an invoice from the latest accepted quote (Phase 16B, Path A). The invoice sale
        price is the accepted quote snapshot total, the terms are the quote's frozen
        terms_snapshot, and the acceptance/signature is inherited (the customer does not re-sign);
        the signed invoice PDF is generated. Requires at least one ACCEPTED quote version
        (QUOTE_NOT_ACCEPTED, 422). Not blocked by an unsigned draft. Follows the existing
        invoice-create LAID rule.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Invoice created from accepted quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/pdf:
    get:
      tags:
        - Quotes
      summary: Download stored quote PDF (salesperson)
      operationId: downloadQuotePdf
      description: >
        Streams a stored quote PDF for the salesperson (Phase 16B): type=issued returns the active
        issued version's stored PDF (inline filename quote-{order_number}-v{n}.pdf); type=accepted
        returns the latest ACCEPTED version's stored signed PDF (implemented 16F PR1 - the
        immutable bytes stored at acceptance, never regenerated; inline filename
        quote-{order_number}-v{n}-signed.pdf). The signed PDF is portal only and is never served on
        the public surface. Missing requested artifact (no active issued version for type=issued;
        no accepted version or no stored signed PDF for type=accepted) returns 404
        (QUOTE_PDF_NOT_FOUND). Allowed when order_status is LAID (read).
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum:
              - issued
              - accepted
      responses:
        '200':
          description: Quote PDF streamed
          headers:
            Content-Disposition:
              description: Inline quote PDF filename generated by backend.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/accepted/signature:
    get:
      tags:
        - Quotes
      summary: Download accepted quote signature image
      operationId: downloadAcceptedQuoteSignature
      description: >
        Streams the customer signature image (image/png) stored when the order's latest ACCEPTED
        quote version was signed on the public link (Phase 16F PR1; the quote analogue of
        downloadCurrentInvoiceSignature). The bytes are the stored server-normalised PNG,
        streamed verbatim: the upload's decoded pixels re-encoded at acceptance (same dimensions
        and pixels; ancillary chunks and trailing bytes dropped), so they are not byte-identical
        to the customer's upload. The workspace accepted.signature_download_path points
        here; consume it verbatim. Inline filename quote-signature-{order_number}-v{n}.png. The
        order is resolved within the session business/store first (an order outside them returns
        404 ORDER_NOT_FOUND; existence is never leaked). No accepted quote version, or no stored
        signature on the latest one, returns 404 (QUOTE_SIGNATURE_NOT_FOUND). A referenced file
        missing from storage returns 500. Allowed when order_status is LAID (read). Portal only -
        never served on the public surface. Not an old-version signature-history endpoint.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Accepted quote signature image streamed
          headers:
            Content-Disposition:
              description: Inline signature filename generated by backend.
              schema:
                type: string
            Content-Length:
              description: Signature file size in bytes.
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}:
    servers:
      - url: /api/v1
    get:
      tags:
        - Quotes
      summary: Open a quote by public token
      operationId: getPublicQuote
      security: []
      description: >
        Public, token-only quote view (Phase 16B; implemented 16E-C behind the slugless page
        /q/{token}). No session; the secret token is the only
        credential and the endpoint exposes only the single quote behind it (cost-free, no
        internal IDs). Never stamps viewed_at. Returns a state derived from the token: ACTIVE
        (viewable, and signable via acceptPublicQuote - implemented 16F PR1; the page's signing UI
        is planned 16F PR3), EXPIRED, SUPERSEDED, CANCELLED (including a quote cancelled by an
        in-app invoice acceptance, 16F decision D5(c)), or INACTIVE (signed; link dead, not a
        viewable signed copy). An unknown token returns 404 (QUOTE_TOKEN_NOT_FOUND). Only an ACTIVE token on an
        ISSUED quote can lazily expire on access. Rate limiting against rapid repeated access by
        token/IP is required by the contract (§8) before production but is NOT implemented at this
        base; whether it is done at application or infrastructure level is undecided (Phase 17).
        Not a documented response.
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Public quote view (with state)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuoteViewWrapper'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}/viewed:
    servers:
      - url: /api/v1
    post:
      tags:
        - Quotes
      summary: Mark a public quote as viewed
      operationId: markPublicQuoteViewed
      security: []
      description: >
        Marks the quote viewed_at (Phase 16B; implemented 16E-C). Write-once and idempotent (later
        calls are no-ops); only meaningful while the token is ACTIVE. Empty JSON object body.
        Unknown token returns 404; a dead link returns 410.
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '200':
          description: View recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuoteViewWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}/accept:
    servers:
      - url: /api/v1
    post:
      tags:
        - Quotes
      summary: Accept (sign) a quote remotely
      operationId: acceptPublicQuote
      security: []
      description: >
        Customer accepts (signs) the issued quote remotely (Phase 16B; implemented 16F PR1). No
        session and no slug: the secret token is the only credential, and nothing beyond the single
        quote behind it is readable or writable. The request is multipart/form-data with exactly
        one part, signature (see QuoteAcceptRequest). accepted_customer_name is not a request part:
        it is taken server-side from the issued version's frozen V17 customer_name_snapshot (16F
        decision D1) - never the live customer record, never typed, never truncated. The
        declaration checkboxes are a frontend gate only and are not sent (decision D8); the signed
        PDF renders them ticked.
        Order of checks. Transport-level rejections happen first, in the framework, before the
        token gate (unchanged global behaviour): a request that is not multipart/form-data returns
        415 (code VALIDATION_FAILED), and a request over the global multipart limit (15 MB file /
        16 MB request) returns 400 FILE_TOO_LARGE. (1) Token gate, before any application-level
        body validation: an unknown or malformed token returns 404 (QUOTE_TOKEN_NOT_FOUND); a dead
        link returns 410 even when the body is also invalid - QUOTE_LINK_EXPIRED (including a link that lapses on this access),
        QUOTE_LINK_SUPERSEDED, QUOTE_LINK_CANCELLED (including a quote cancelled by an in-app
        invoice acceptance, 16F decision D5(c)) or QUOTE_LINK_INACTIVE (already signed).
        (2) Body validation, with no database access or lock: any file part, form field or request
        parameter other than a single signature part (including a repeated signature) returns 400
        (VALIDATION_FAILED, one detail per offending part); a missing or empty signature returns
        422 (SIGNATURE_REQUIRED, message "A signature is required to accept this quote."); a
        signature that breaks the QuoteAcceptRequest rules (declared type not image/png, over
        2097152 bytes, no PNG signature, first chunk not a 13-byte IHDR, outside the safe-decode
        bounds - over 8192 px per side or 4000000 px, bit depth over 8, or an invalid colour type -
        or not decodable by the PNG reader) returns 400 (SIGNATURE_INVALID). (3) One transaction under the order row lock that every
        protected quote, invoice, line and price mutation also takes. The token is re-read under
        the lock: a link that died while waiting returns its 410, and a link whose expiry fell due
        is expired (committed) and returns 410 QUOTE_LINK_EXPIRED. Then, before anything is
        written and in this order, a missing name snapshot (ACCEPTED_CUSTOMER_NAME_REQUIRED), a
        frozen quote total ex GST below the order's live product + charge line cost
        (QUOTE_BELOW_COST, decision D11) or an order price that cannot be stored (a value outside
        DECIMAL(10,2) or a negative total cost - BUSINESS_RULE_VIOLATION) returns 422 with the same public-safe message "This quote can no
        longer be accepted online. Please contact the store." (no cost or GP figures), and nothing
        is written. A blank details of sale or a zero total does not block acceptance.
        On success the same transaction stores the server-normalised signature PNG (the decoded
        pixels re-encoded: same dimensions and pixels as the upload, ancillary chunks and trailing
        bytes dropped - the bytes the signed PDF embeds and downloadAcceptedQuoteSignature
        streams) and the signed quote PDF (rendered from the frozen issued snapshot with the
        acceptance area filled), moves the version ISSUED -> ACCEPTED (its snapshot total is the
        legal billing number) and the token ACTIVE -> CONSUMED (the link is dead: GET then returns
        state INACTIVE; viewed, pdf and accept return 410 QUOTE_LINK_INACTIVE), and applies the
        signed total inc GST as the order's standard sale-price override (16F decision D6b, the
        one amendment to the 16D-A quote/order price separation): price_adjustment_inc_gst =
        accepted total inc GST - the calculated line total inc GST at acceptance (replacing any
        earlier override), and sale_price_ex_gst, total_cost, gp and gp_percent are recomputed.
        Like any override the adjustment then stays fixed: later Products & Charges edits (only
        while the order is not LAID) shift the working price relative to the signed total, and the
        manual override/reset remain the correction tools; Path A (createInvoiceFromQuote,
        planned 16F PR2) bills the frozen accepted snapshot, never the working order price.
        Nothing else on the order changes (draft, lines, order status, invoices, payments). Any failure rolls the whole acceptance back and deletes only
        the files this request wrote. Allowed when order_status is LAID, including the price write
        (decision D4); the protected sale-price endpoints keep their LAID gate.
        After commit only, the store is emailed an acceptance notification (to the order's store
        email; skipped with a WARN log when blank; no attachment, link, token, cost or GP;
        recording-only in this build - no real email is sent). A notification failure is logged
        and never undoes the acceptance. The signed PDF is portal-only
        (GET /orders/{orderId}/quote/pdf?type=accepted) and is never served on the public surface.
        Rate limiting (contract §8) is not implemented at this base (Phase 17).
      parameters:
        - $ref: '#/components/parameters/Token'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QuoteAcceptRequest'
            encoding:
              signature:
                contentType: image/png
      responses:
        '201':
          description: >-
            Quote accepted; the public link is now dead. data.state is always INACTIVE and message
            is "Quote accepted." - no id, amount, name, timestamp, file reference or token is
            returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicQuoteAcceptResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '415':
          description: >-
            Not multipart/form-data (transport-level rejection by the framework, before the token
            gate); error.code VALIDATION_FAILED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /public/quotes/{token}/pdf:
    servers:
      - url: /api/v1
    get:
      tags:
        - Quotes
      summary: Download the issued quote PDF (public)
      operationId: downloadPublicQuotePdf
      security: []
      description: >
        Streams the issued quote PDF to the customer only while the token is ACTIVE (Phase 16B;
        implemented 16E-C - the stored issued bytes, never regenerated).
        Cost-free. Once the token is CONSUMED (signed) or otherwise dead the endpoint returns 410;
        an unknown token returns 404. The signed PDF is never served here - it is portal only.
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Issued quote PDF streamed
          headers:
            Content-Disposition:
              description: Inline quote PDF filename generated by backend.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    SessionCookieAuth:
      type: apiKey
