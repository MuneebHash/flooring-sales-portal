    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    UnprocessableEntity:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    BadGateway:
      description: >
        Bad Gateway. An upstream/provider dependency failed (e.g. the email provider could not
        send the invoice — error.code EMAIL_SEND_FAILED). Phase 13.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    Gone:
      description: >
        Gone. The public quote link is no longer usable - it has expired (QUOTE_LINK_EXPIRED),
        been replaced/superseded (QUOTE_LINK_SUPERSEDED), been cancelled (QUOTE_LINK_CANCELLED),
        or already been signed (QUOTE_LINK_INACTIVE). Phase 16B.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardErrorResponse'