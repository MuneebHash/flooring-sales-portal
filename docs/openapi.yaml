  /orders/{orderId}/invoices/current/accept:
    post:
      tags:
        - Invoices
      summary: Accept current invoice
      operationId: acceptCurrentInvoice
      description: >
        Accepts/signs the current invoice (Phase 13). Captures the customer signature
        (image/png, max 2 MB) and accepted customer name, appends a new signed current invoice
        version, regenerates the signed PDF, and automatically emails the accepted PDF to the
        order customer's email, updating last_emailed_at. Requires a current invoice that is not
        already accepted and a valid customer email. Allowed when order_status is LAID. If the
        email send fails the acceptance is still persisted (201) with last_emailed_at null; use
        Resend to retry. Phase 16F PR1 (decision D5(c)): the same transaction also cancels the
        order's ISSUED quote version, if any, and its ACTIVE public-link token (both CANCELLED; the
        public quote link then reports CANCELLED); with no ISSUED quote this is a silent no-op.
        Only the version ISSUED at that moment is affected: a quote sent later can still be signed,
        and because its signature is then strictly newer than this invoice's, createInvoiceFromQuote
        (Path A, 16F PR2) may convert it by appending a new invoice version, with this signed
        version kept in history (decision D5(b) as amended on 8 October 2026; quotation contract
        section 13). An ACCEPTED quote never blocks this endpoint and is never touched (D5(d)).
        TODAY the request carries accepted_customer_name (1-150 characters, not blank) and
        signature; the request schema below is the 16G PR 3 target.
        16G PR 3 (planned, #69; docs/API-Contracts-Phase16G-Invoice-Link.md section 5.4): the
        parts are exactly expected_version_number and signature. Order of checks: transport (400
        FILE_TOO_LARGE, 415); standard guard and positive orderId; the order scoped and locked
        (404 ORDER_NOT_FOUND); the current invoice read under the lock (none: 422
        INVOICE_REQUIRED); expected_version_number validation (400 VALIDATION_FAILED); the stale
        comparison with the current version_number (409 INVOICE_VERSION_STALE "Invoice updated,
        please refresh"); already accepted (409 INVOICE_ALREADY_ACCEPTED, unchanged); the part
        allowlist (any other part, including accepted_customer_name: 400 VALIDATION_FAILED); the
        current version's frozen customer_name_snapshot null or blank (422
        ACCEPTED_CUSTOMER_NAME_REQUIRED; the accepted name is that stored value, verbatim, full
        length, with no 150-character limit); the signature (422 SIGNATURE_REQUIRED / 400
        SIGNATURE_INVALID); the customer email gate (422 CUSTOMER_EMAIL_REQUIRED / INVALID,
        unchanged); persist; then post-commit email and stamp. From PR 3 no post-commit step can
        turn the committed acceptance into an error, and the message reports the delivery
        outcome. A failed delivery, including any sender runtime failure, is logged at WARN;
        last_emailed_at and the mirror stay null and the response is 201 with the not-emailed
        message. A stamp failure after a successful delivery is logged at WARN only; the
        response is 201 with the emailed message, and last_emailed_at and the mirror stay null,
        so Re-send Invoice stays available. Today only the transport failure is caught: another
        sender failure or a stamp failure returns 500 after commit. The version is appended with
        the copied frozen words (16G PR 2) and, from 16G PR 3, the current version's
        invoice_date, so the signed PDF shows the date of the invoice the customer was shown;
        accepted_at records the signing time. Today the appended version is dated the signing day
        (LocalDate.now(), as every invoice writer dates its version). From 16G PR 4 the same
        transaction marks an ACTIVE invoice link SIGNED.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SignatureAcceptRequest'
            encoding:
              signature:
                contentType: image/png
      responses:
        '201':
          description: >-
            Invoice accepted (and emailed unless the send failed). Message "Invoice accepted and
            emailed to the customer." when the delivery returned success, otherwise "Invoice
            accepted. The invoice could not be emailed — use Re-send Invoice to try again."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/current/resend:
    post:
      tags:
        - Invoices
      summary: Resend current accepted invoice
      operationId: resendCurrentInvoice
      description: >
        Re-sends the current accepted invoice PDF to the customer and updates last_emailed_at
        (Phase 13). The request body must be an empty JSON object. Requires a current invoice
        that has been accepted and a valid customer email. Does not require a new signature and
        does not create a new invoice version. Returns 502 when the email provider fails.
        Allowed when order_status is LAID. Re-send stays the retry route for every signed-PDF
        email, including the 16G Path A (PR 3) and remote signing (PR 4) emails. It never sends
        an invoice link (that is sendInvoiceLink, 16G PR 4).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '200':
          description: Invoice re-sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/invoices/current/send-link:
    post:
      tags:
        - Invoices
      summary: Email the customer a link to sign the current invoice (Accept Remotely)
      operationId: sendInvoiceLink
      description: >
        16G PR 4 (planned; not implemented until PR 4 merges;
        docs/API-Contracts-Phase16G-Invoice-Link.md section 8). The Invoice tab's Accept Remotely
        button calls it (PR 5). Standard
        protected. The request body is an empty JSON object (EmptyObjectRequest); no signature,
        name or declaration is sent. Order of checks: standard guard and positive orderId; the
        order scoped and locked (404 ORDER_NOT_FOUND); empty-body validation (400); the current
        invoice read under the lock (none: 422 INVOICE_REQUIRED); the current invoice signed (409
        INVOICE_ALREADY_ACCEPTED, default message "This invoice has already been accepted. Use
        Re-send to email it again."; no link is created and any existing link is untouched); the
        saved customer email gate (422 CUSTOMER_EMAIL_REQUIRED / CUSTOMER_EMAIL_INVALID). Then, in
        the same transaction, an existing ACTIVE invoice link becomes REPLACED and a new ACTIVE
        link is minted (sent_at now, expires_at sent_at + 7 days; at most one ACTIVE link per
        order). After commit, outside the lock, one link-only email goes to the saved customer
        email through its own InvoiceLinkEmailSender: subject "Your invoice from
        {business_name}", a short plain-text body with the order number and the link
        {app.public-base-url}/i/{token} exactly once, NO PDF attached; recording-only until the
        Phase 17 provider, never logging the bearer link at INFO or above. A successful delivery
        stamps the link's emailed_at (a stamp failure is logged at WARN and the response is still
        201). Link sends write only the link's own markers; they never set invoice.last_emailed_at
        or the sales_order.last_emailed_at mirror. Not required: a signature, the declaration
        ticks, an unchanged version (the link follows the order's latest version) or any quote
        state. Allowed when order_status is LAID; there is no CANCELLED rule. The response never
        contains the token, hash, link, storage path or recipient. There is no list, status or
        cancel endpoint for invoice links.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: >-
            Link minted and emailed. Message "Invoice link emailed to the customer."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceLinkSendResultWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: >-
            The link email could not be delivered: EMAIL_SEND_FAILED, message "The invoice link
            could not be emailed. Please try again." The new link stays ACTIVE (undelivered) and
            the previous link stays REPLACED; a retry is another send, which replaces the
            undelivered link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardErrorResponse'

