  /orders/{orderId}/quote/send-email:
    post:
      tags:
        - Quotes
      summary: Send quote by email
      operationId: sendQuoteEmail
      description: >
        Issues (or resends) the quote and emails the public quote link (Phase 16B; implemented
        16E-A). Link-only since 16F PR1: a short plain-text body carrying the public quote link
        exactly once and NO PDF attachment (16E-A attached the issued PDF). The immutable issued PDF
        is still generated and stored when a new version is issued; the customer opens it from the
        public page (GET /public/quotes/{token}/pdf) and the salesperson via
        GET /orders/{orderId}/quote/pdf?type=issued. The link's token is the credential for the
        public view, viewed, PDF and accept endpoints (acceptPublicQuote implemented 16F PR1; the
        public signing UI implemented 16F PR3). A draft or customer name/billing change since the
        last issue (compared with the V17 issue-time snapshot), or no active ISSUED version at all
        (never sent, cancelled, expired or accepted), creates a new ISSUED version (next
        version_number) that supersedes any previous ISSUED one; otherwise the same version is
        re-sent with a new ACTIVE token (old token REPLACED) and its stored PDF is kept as is
        (never regenerated). Either way the issued version, its stored PDF and the new token are
        persisted before delivery. Sending after an acceptance is allowed (16F decision D9): it
        issues a new version that needs a new signature and never changes the ACCEPTED version. A
        send never writes the order sale price (only acceptPublicQuote does, decision D6b). In the
        current build delivery is recorded in memory only - no real email is sent. Re-checks
        below-cost (QUOTE_BELOW_COST, 422) and requires a valid customer email
        (CUSTOMER_EMAIL_REQUIRED / CUSTOMER_EMAIL_INVALID, 422). Blocked when LAID (ORDER_LOCKED,
        422). On provider failure returns 502 (EMAIL_SEND_FAILED); the issued version/PDF/token
        are kept and the salesperson resends.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObjectRequest'
      responses:
        '201':
          description: Quote issued and emailed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteSendResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
