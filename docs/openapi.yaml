  /orders/{orderId}/quote/draft:
    put:
      tags:
        - Quotes
      summary: Upsert quote draft
      operationId: upsertQuoteDraft
      description: >
        Creates or replaces the editable quote draft (itemised flag, customer-facing lines and
        adjustments) for the order (Phase 16B). An itemised save full-replaces the draft lines:
        the server recomputes totals, enforces total == sum of lines (auto-inserting a negative
        adjustment line on a direct reduction via final_total_inc_gst) and rejects a total above
        the line sum (QUOTE_TOTAL_EXCEEDS_LINES, 422; itemised saves only). A non-itemised save
        (itemised false, final_total_inc_gst required, lines must be empty) is header-only
        (Phase 16D-B PR2A): it updates mode/totals (inc = final_total_inc_gst; ex = final / 1.10
        HALF_UP 2dp), creates NO synthetic line, and never writes or deletes quote_draft_line
        rows — lines persisted by the last itemised save are retained as dormant rows and are
        returned in the response lines[]. The non-itemised total is never validated against
        retained lines. Below-cost saves are blocked in both modes (QUOTE_BELOW_COST, 422):
        itemised uses the visible line sum, non-itemised the final-total-derived ex total. The
        quote draft is independent of order pricing: a save does NOT update the order sale-price
        override or any sales_order header financials, and quote lines never mutate the order's
        product/charge lines. Blocked when order_status is LAID (ORDER_LOCKED, 422).
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteDraftUpsertRequest'
      responses:
        '200':
          description: Quote draft saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteDraftResponseWrapper'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
