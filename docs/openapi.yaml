        - NEW_ACHIEVED_SALE
        - FOLLOW_UP
        - ACCEPTED
        - LAID
        - CANCELLED

    LayDateStatus:
      type: string
      enum:
        - CONFIRMED
        - TO_BE_CONFIRMED

    PaymentMethod:
      type: string
      enum:
        - CASH
        - CREDIT_CARD
        - EFTPOS
        - BANK_TRANSFER

    AttachmentKind:
      type: string
      enum:
        - PHOTO
        - SIGNATURE

    PhotoAttachmentKind:
      type: string
      enum:
        - PHOTO

    AddressType:
      type: string
      enum:
        - BILLING
        - INSTALLATION

    PricingUnit:
      type: string
      enum:
        - LM
        - SQM

    StockUnit:
      type: string
      enum:
        - LM
        - SQM

    Money:
      type: number
      format: double
      example: 45.00
      description: AUD money amount, returned with two decimal places.

    Date:
      type: string
      format: date
      example: '2026-05-01'

    Timestamp:
      type: string
      format: date-time
      example: '2026-04-22T14:30:00'
      description: Server-local timestamp returned as YYYY-MM-DDTHH:mm:ss.

    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - page_size
        - total_items
        - total_pages
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total_items:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    ValidationErrorDetail:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        section:
          type: string
          nullable: true
        field:
          type: string
          nullable: true
        message:
          type: string

    StandardError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ValidationErrorDetail'

    StandardErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/StandardError'

    NullDataResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          nullable: true
          description: Always null.
          example: null
        message:
          type: string

