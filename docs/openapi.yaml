    QuoteAcceptedSummary:
      type: object
      additionalProperties: false
      description: >-
        The order's LATEST accepted quote version (max(version_number) among ACCEPTED versions;
        Phase 16F PR1), selected independently of the draft and of current_issued; older accepted
        versions remain signed history and are not surfaced. Every body field is the frozen
        accepted snapshot - never the live draft or order; quote_total_inc_gst is the legal billing
        number. All fields are always present (nullable ones as null). Protected portal view only:
        no stored_file id, storage path, token, hash, cost or GP field.
      required:
        - quote_version_id
        - version_number
        - quote_total_inc_gst
        - accepted_at
        - accepted_customer_name
        - accepted_signature_present
        - invoice_eligible
        - quote_total_ex_gst
        - itemised
        - flooring_type
        - details_of_sale
        - lines
        - signature_download_path
        - signed_pdf_available
      properties:
        quote_version_id:
          type: integer
          format: int64
        version_number:
          type: integer
        quote_total_inc_gst:
          $ref: '#/components/schemas/Money'
        accepted_at:
          $ref: '#/components/schemas/Timestamp'
        accepted_customer_name:
          type: string
          description: >-
            Frozen at acceptance from the issued version's V17 customer_name_snapshot (16F decision
            D1) - never the live customer record, never typed, never truncated.
        accepted_signature_present:
          type: boolean
          description: True when a signature image is stored for this accepted version.
        invoice_eligible:
          type: boolean
          description: >-
            False when the order's current invoice (highest version_number) is already accepted
            (16F decision D5(b): Create Invoice from the accepted quote is then unavailable -
            "Invoice already accepted"); true when the order has no invoice or its current invoice
            is unsigned. An unsigned draft or a newer issued quote never makes it false. Read-only
            flag; Create Invoice from the accepted quote (createInvoiceFromQuote, Path A) is
            planned 16F PR2.
        quote_total_ex_gst:
          $ref: '#/components/schemas/Money'
        itemised:
          type: boolean
        flooring_type:
          $ref: '#/components/schemas/FlooringType'
        details_of_sale:
          type: string
          nullable: true
          description: The frozen details_of_sale_snapshot as issued (may be null or blank).
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteIssuedLine'
          description: >-
            Accepted snapshot lines in display order; always empty when the accepted quote is
            non-itemised.
        signature_download_path:
          type: string
          nullable: true
          description: >-
            Backend-built protected path /api/v1/{slug}/orders/{orderId}/quote/accepted/signature
            (downloadAcceptedQuoteSignature); consume verbatim. Null when no signature is stored.
        signed_pdf_available:
          type: boolean
          description: >-
            True when the stored signed PDF exists; stream it via
            GET /orders/{orderId}/quote/pdf?type=accepted.

