        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}/quote/create-invoice:
    post:
      tags:
        - Quotes
      summary: Create invoice from accepted quote (Path A)
      operationId: createInvoiceFromQuote
      description: >
        IMPLEMENTED 16F PR2 (backend; the Accepted Quote Create Invoice button implemented 16F PR3).
        Creates an invoice version from the order's LATEST ACCEPTED quote version (highest
        version_number with status ACCEPTED; a newer draft or ISSUED, SUPERSEDED, CANCELLED or
        EXPIRED version never replaces it), inheriting its signature so the customer does not
        re-sign. The request body must be an empty JSON object, as for the other invoice actions
        (the server also accepts an absent body); any field (for example a quote-version
        selector, price, terms, signature id or due date) returns 400 VALIDATION_FAILED and an
        unparseable body 400 MALFORMED_JSON. Checks run in this order: standard guard, positive
        orderId, then the order scoped to the session business and store, which takes the order
        row lock (404 ORDER_NOT_FOUND); every later check, the PDF and file work, the insert and
        the mirror reset run under that lock: empty body, the latest accepted version (none: 422
        QUOTE_NOT_ACCEPTED "This quote has not been accepted yet."), then
        signature precedence against the current invoice (decision D5(b) as amended on 8 October
        2026): allowed when there is no invoice (new version 1), when the current invoice is
        unsigned, or when the quote's accepted_at is strictly later than the current invoice's
        accepted_at (new version = current + 1); an equal or earlier quote signature returns 409
        INVOICE_ALREADY_ACCEPTED with "The current invoice was signed at the same time or later
        than this quote. A newer signed quote is required to create an invoice from a quote." and
        nothing is appended (signature times are compared, never creation times, version numbers
        or email times). Then the collected preconditions (422 INVOICE_PRECONDITIONS_NOT_MET with
        section/field/message details): customer first and last name, installation and billing
        address rows, proposed lay date and lay date status (as Path B), a non-blank frozen
        details of sale on the accepted quote (details/details_of_sale), and accepted quote totals
        greater than zero (financial/sale_price_ex_gst and financial/sale_price_inc_gst). Live
        priced lines, the live order price, the live details of sale and the customer email are
        not checked (no email gate). Then active (non-voided) payments must not exceed the signed
        inc-GST total (else 422 BUSINESS_RULE_VIOLATION "Recorded payments exceed the accepted
        quote total. Void the excess payments before creating an invoice from this quote.";
        exactly paid is allowed). Allowed when order_status is LAID in every permitted case. The
        invoice copies the accepted quote's details_of_sale_snapshot, quote_total_ex_gst and
        quote_total_inc_gst verbatim, its frozen terms_snapshot (including null) and
        source_quote_version_id, and inherits accepted_at, accepted_customer_name and the same
        signature stored_file (no new signature file); invoice_date is today, due_date is the
        order's proposed lay date minus 2 days, Invoice To (16G PR 2, #125) is the accepted
        quote's V17 customer_name_snapshot, customer_address_line1_snapshot and
        customer_address_line2_snapshot, verbatim (including null) - never the live customer,
        which only feeds the preconditions above - total_paid is the active payment sum,
        balance_due is the signed inc total minus it, and last_emailed_at is null
        (sales_order.last_emailed_at is reset to null). The signed invoice PDF is stored; the
        invoice has no lines. The order status, working price, lines,
        quote draft, quote versions and tokens (an ISSUED quote stays live), customer data and
        payments are not changed, and no email or notification is sent. Any failure rolls back
        every write and deletes only the new invoice PDF. 201 returns the InvoiceDetail (accepted,
        terms_source QUOTE) with the message "Invoice created from accepted quote."
        The paragraph above describes the behaviour TODAY (an empty body). The request schema
        below is the 16G PR 3 target. 16G amendments (planned;
        docs/API-Contracts-Phase16G-Invoice-Link.md sections 5.5 and 6):
        16G PR 3 (#123): the body is mandatory, {"quote_version_id": N}, the accepted version
        shown in the open confirmation (CreateInvoiceFromQuoteRequest; an absent or empty body
        is 400 "Required."). Order of checks: guard and positive orderId; the order scoped and
        locked (404 ORDER_NOT_FOUND); the latest ACCEPTED version read under the lock (none: 422
        QUOTE_NOT_ACCEPTED); body validation (400 VALIDATION_FAILED / MALFORMED_JSON); the stale
        comparison with the latest accepted version's id (409 QUOTE_VERSION_STALE "The accepted
        quote changed while the confirmation was open. Review the accepted quote before creating
        an invoice."); then signature precedence (409 INVOICE_ALREADY_ACCEPTED, unchanged), the
        preconditions and the overpayment check (unchanged), the inherited signature read and
        persist. The value is only compared, never used to select a row. 16G PR 3 also replaces
        "no email": after commit the signed invoice PDF is emailed to the saved customer email
        (the InvoiceEmailSender D.8 uses), with NO email gate before creation - a missing or
        invalid saved email skips the send with a WARN log; a delivery, sender or stamp failure
        is non-fatal (WARN, 201); success stamps last_emailed_at and the mirror. The message
        reports the delivery outcome: a stamp failure after a successful delivery keeps the
        delivered message, with last_emailed_at and the mirror null. Messages:
        "Invoice created from accepted quote and emailed to the customer." (delivered);
        "Invoice created from accepted quote. The invoice could not be emailed — use Re-send
        Invoice to try again." (failed); "Invoice created from accepted quote. It was not emailed
        because the customer has no valid email address — add one on the Customer tab, then use
        Re-send Invoice." (skipped). No store notification.
        16G PR 4: the same transaction marks an ACTIVE invoice link SIGNED. Path A still never
        changes a quote version or quote token.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
