spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/flooring_sales_portal
spring.datasource.username=flooring_user
spring.datasource.password=flooring_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never

server.servlet.session.cookie.name=SP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# Local-dev CORS: explicit Vite dev-server origins (5173 + 5174).
# Required because allowCredentials=true forbids wildcard origins.
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

springdoc.swagger-ui.path=/swagger-ui.html