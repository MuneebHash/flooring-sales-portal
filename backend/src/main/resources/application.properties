spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/flooring_sales_portal
spring.datasource.username=flooring_user
spring.datasource.password=flooring_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.property-naming-strategy=SNAKE_CASE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never

# Attachment storage (Chunk 3 Branch 5). base-dir is the filesystem root under which
# stored_file.storage_path (a virtual "/uploads/{businessId}/orders/{orderId}/{uuid}.{ext}" path) is
# resolved on write/read/delete. Override per environment (local disk now; S3 in a later phase).
app.storage.base-dir=${java.io.tmpdir}/flooring-sales-portal-uploads

# Multipart limits set ABOVE the contract's 10 MB rule so the service-level size check returns
# 400 FILE_TOO_LARGE rather than a container-level rejection (the default max-file-size is only 1 MB).
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB

server.servlet.session.cookie.name=SP_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=12h

# Local-dev CORS: explicit Vite dev-server origins (5173 + 5174).
# Required because allowCredentials=true forbids wildcard origins.
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

springdoc.swagger-ui.path=/swagger-ui.html